function clamp(v,min=0,max=100){return Math.max(min,Math.min(max,Number.isFinite(v)?v:min));}
function rng(s){let x=s.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;s.seed=x>>>0;return(s.seed>>>0)/4294967296;}

function portfolio(s){return s.markets.reduce((t,m)=>t+(s.holdings[m.id]?.qty||0)*m.price,0);}

function canAct(s,cost=0,ap=1,minAge=0){if(s.dead)throw Error('This life has ended. Continue your legacy or start a new life.');if(s.pending)throw Error('Make your yearly choice first.');if(s.age<minAge)throw Error('This unlocks at age '+minAge+'.');if(s.ap<ap)throw Error('You have used your energy for this year. Age up to recharge.');if(s.cash<cost)throw Error('You need $'+Math.ceil(cost).toLocaleString()+' in available cash.');}

function career(s,action){if(!s.job)throw Error('Find a job first.');if(action==='quit'){canAct(s,0,0);log(s,'A new direction.','Left your role as '+s.job.name+'.','career');s.job=null;return s;}if(action==='retire'){canAct(s,0,0,60);s.job=null;s.retired=true;log(s,'A well-earned retirement.','You will receive an $18,000 annual pension.','career');return s;}spend(s,0,1);if(action==='work'){s.job.performance=clamp(s.job.performance+15);stats(s,{smarts:2,health:-2});log(s,'Went the extra mile.','Your performance at work improved.','career');}else if(action==='raise'){if(s.job.performance<80)throw Error('Reach 80% performance before asking for a raise.');s.job.salary=Math.round(s.job.salary*1.15);s.job.performance-=18;s.job.rank++;log(s,'Your hard work paid off.','Promoted! Your salary is now $'+s.job.salary.toLocaleString()+'.','career');}else throw Error('Choose a career action.');return s;}

E.normalizeAppearance=function(value={}){const result={};for(const[key,options]of Object.entries(E.APPEARANCE_OPTIONS))result[key]=options.some(([v])=>v===value?.[key])?value[key]:options[0][0];return result;};
function ensure(s){
 s.appearance=E.normalizeAppearance(s.appearance);
 if(!s.world)s.world={version:2,skills:{},certificates:[],projects:[],pets:[],social:[],trips:[],policies:[],conditions:[],bonds:[],collections:[],goals:[],completed:{},counters:{actions:0,competitions:0,wins:0,royalties:0,followers:0,donations:0},achievements:[],settings:{unlimited:false,theme:'light'},career:{applications:0},lastExtra:null};

E.configureCharacter=function(s,options){const name=String(options.name||'').trim();if(!name||name.length>60)throw Error('Choose a name between 1 and 60 characters.');const pronouns=options.pronouns||s.pronouns;if(!['He / him','She / her','They / them'].includes(pronouns))throw Error('Choose your character’s pronouns.');s.name=name;s.pronouns=pronouns;s.city=String(options.city||s.city).slice(0,80);s.appearance=E.normalizeAppearance(options.appearance);if(options.looks!==undefined)s.stats.looks=cap(Number(options.looks));return s;};
function gate(s,cost=0,ap=1,age=0){const w=ensure(s);if(s.dead)throw Error('This life has ended. Continue your legacy or visit the sandbox.');if(s.pending)throw Error('Finish your yearly choice first.');if(s.age<age)throw Error('This opens at age '+age+'.');if(s.cash<cost)throw Error('You need $'+Math.ceil(cost).toLocaleString()+' available.');if(!w.settings.unlimited&&s.ap<ap)throw Error('Age up to recharge your energy.');}
function pay(s,cost=0,ap=1,age=0){gate(s,cost,ap,age);s.cash-=cost;if(!ensure(s).settings.unlimited)s.ap-=ap;}
function change(s,obj){for(const[k,v]of Object.entries(obj))if(k in s.stats)s.stats[k]=cap(s.stats[k]+v);}

E.perform=function(s,actionId){const a=ACTIONS.find(a=>a.id===actionId);if(!a)throw Error('Activity not found.');const w=ensure(s),level=w.skills[a.category]||0;if(level<a.require)throw Error('Reach level '+a.require+' in '+CATEGORIES.find(c=>c.id===a.category).name+' first. Practice the earlier activities to build your skill.');if(a.mode==='certificate'&&w.certificates.includes(a.category))throw Error('You already earned this certificate.');gate(s,a.cost,1,a.minAge);yearlyLimit(s,a.id,a.mode==='certificate'?1:2);pay(s,a.cost,1,a.minAge);let message='';const gain=a.mode==='practice'?8:a.mode==='certificate'?3:5;w.skills[a.category]=cap(level+gain);w.completed[a.id]=(w.completed[a.id]||0)+1;w.counters.actions++;change(s,{[a.stat]:a.stat==='health'?4:3,happiness:2});

 if(a.mode==='create'){const value=Math.round(100+level*7+(E.rng(s)*.4+.8)*a.cost);const p={id:id(s,'project'),name:a.name.replace(/^(Publish|Release|Create|Produce|Write|Design|Build|Direct|Organize|Restore) /,''),category:a.category,quality:Math.round(cap(level+E.rng(s)*20)),royalty:value,years:0};w.projects.push(p);change(s,{fame:3});message='A new project is finished. It starts earning royalties next year.';}

 if(!message)message='Your '+CATEGORIES.find(c=>c.id===a.category).name.toLowerCase()+' skill grew to '+w.skills[a.category]+'.';

function explorePage(){const counts=E.extraCounts();return`<div class="explore-banner"><div><span class="life-kicker">THE EXPANDED EDITION</span><h2>A whole world.<br>One extraordinary you.</h2><p>${counts.actions} new activities · ${counts.jobs} careers · ${counts.industries} businesses</p></div><div class="explore-orbit">${I('globe')}<i></i><i></i><i></i></div></div><div class="explore-grid">${EXPLORERS.map(([id,ic,name,desc,color])=>`<button class="explore-tile" data-nav="${id}">${iconBox(ic,color)}<span><strong>${name}</strong><small>${desc}</small></span>${I('chevron')}</button>`).join('')}</div><div class="explore-utilities"><button data-action="new">${I('refresh')} Start a new life</button><button data-action="save-menu">${I('download')} Save & load</button><button data-action="admin">${I('sliders')} Sandbox panel</button></div>`;}
function activityHub(){return`<button class="activity-hub-banner" data-nav="skills"><div>${I('sparkles')}<span><strong>Find your next obsession.</strong><small>260 activities · 26 skills · competitions & projects</small></span></div>${I('arrow')}</button>`;}
function skillsPage(){const st=s();return`${activityHub()}<div class="xp-summary"><div><strong>${Object.keys(w().skills).length}</strong><span>Skills explored</span></div><div><strong>${w().certificates.length}</strong><span>Certificates</span></div><div><strong>${w().counters.wins}</strong><span>Competition wins</span></div></div><div class="section-title"><h2>What sparks your curiosity?</h2><button class="text-button" data-extra="catalog" data-value="all">Browse all ${I('arrow')}</button></div><div class="skill-grid">${E.CATEGORIES.map(c=>`<button class="skill-tile" data-extra="catalog" data-value="${c.id}">${iconBox(c.icon,c.color)}<div><h3>${c.name}</h3><p>${st.age<c.minAge?'Opens at age '+c.minAge:'10 activities · '+(w().skills[c.id]||0)+'/100 skill'}</p><div class="skill-meter"><i style="width:${w().skills[c.id]||0}%;background:${c.color}"></i></div></div>${I('chevron')}</button>`).join('')}</div><button class="activity-hub-banner" data-extra="projects"><div>${I('book')}<span><strong>Your creative portfolio</strong><small>${w().projects.length} ${w().projects.length===1?'project':'projects'} · ${money(w().counters.royalties,true)} lifetime royalties</small></span></div>${I('arrow')}</button>`;}
function actionCard(a){const skill=E.skill(s(),a.category),locked=skill<a.require||s().age<a.minAge,done=w().completed[a.id]||0;const modes={practice:'Practice · +8 skill',compete:'Competition · cash prizes',gig:'Freelance work · earn cash',create:'Creative project · yearly royalties',certificate:'Earn a certificate'};return`<button class="catalog-action ${locked?'locked':''}" data-extra="perform" data-value="${a.id}"><div class="catalog-action-top"><strong>${esc(a.name)}</strong>${I(locked?'lock':'arrow')}</div><p>${modes[a.mode]}</p><div class="catalog-tags"><span>${a.cost?money(a.cost):'Free'}</span><span>1 energy</span>${a.require?`<span>Skill ${a.require}+</span>`:''}${s().age<a.minAge?`<span>Age ${a.minAge}+</span>`:''}${done?`<span class="completed">Done ${done}×</span>`:''}</div></button>`;}
function showCatalog(category='all'){const cat=E.CATEGORIES.find(c=>c.id===category);modal(`${modalHeader(cat?.icon||'sparkles','THE WORLD IS YOUR CLASSROOM',cat?.name||'260 ways to live.',cat?'Skill '+E.skill(s(),category)+'/100. Practice early activities to unlock competitions, paid gigs, creative projects, and certificates.':'Explore every interest. Search a name or choose a category.')}<div class="catalog-search"><input class="input" type="search" id="activity-search" placeholder="Search activities…" aria-label="Search activities" autocomplete="off"></div><div class="catalog-categories"><button class="${category==='all'?'active':''}" data-extra="catalog" data-value="all">All interests</button>${E.CATEGORIES.map(c=>`<button class="${category===c.id?'active':''}" data-extra="catalog" data-value="${c.id}">${c.name}</button>`).join('')}</div><div id="catalog-results" class="catalog-results"></div>`,{large:true,view:()=>showCatalog(category)});const update=()=>{const q=document.getElementById('activity-search').value.toLowerCase().trim();const matches=E.ACTIONS.filter(a=>(category==='all'||a.category===category)&&(!q||(a.name+' '+a.category).toLowerCase().includes(q)));document.getElementById('catalog-results').innerHTML=`<p class="catalog-count">${matches.length} activities · tap one to play</p>`+(matches.length?matches.map(actionCard).join(''):'<div class="empty"><p>Try another search. There is a whole world to explore.</p></div>');};document.getElementById('activity-search').oninput=update;update();}
function petsPage(){return`<div class="pet-hero"><span>🐕 🐈 🦜</span><h2>Small friends.<br>Big feelings.</h2><p>Give someone a home, and get a little more love in yours.</p></div>${w().pets.length?`<section><div class="section-title"><h2>Your little companions</h2></div><div class="pet-grid">${w().pets.map(p=>{const d=E.PET_TYPES.find(d=>d.id===p.type);return`<button class="pet-card ${p.alive?'':'gray'}" data-extra="pet" data-value="${p.id}"><span class="pet-emoji">${d.emoji}</span><h3>${esc(p.name)}</h3><p>${d.name} · ${p.age} ${p.age===1?'year':'years'} · ${p.alive?'Bond '+Math.round(p.bond)+'%':'Always remembered'}</p><div class="skill-meter"><i style="width:${p.bond}%;background:#c3a17d"></i></div></button>`;}).join('')}</div></section>`:''}<section><div class="section-title"><h2>Find your new best friend</h2></div><div class="pet-grid">${E.PET_TYPES.map(p=>`<button class="pet-card" data-extra="adopt-pet" data-value="${p.id}"><span class="pet-emoji">${p.emoji}</span><h3>${p.name}</h3><p>${money(p.cost)} adoption · ${money(p.upkeep)}/year</p><span class="badge">Meet a little friend ${I('arrow')}</span></button>`).join('')}</div></section>`;}
function showAdoptPet(type){const d=E.PET_TYPES.find(p=>p.id===type);modal(`${modalHeader('heart','ROOM FOR ONE MORE?', 'Meet your new '+d.name.toLowerCase()+'.','Adoption is '+money(d.cost)+', with '+money(d.upkeep)+' in yearly care. Your pet needs attention, play, and occasional vet visits.')}<form id="pet-form"><div class="field"><label for="pet-name">What will you call your companion?</label><input class="input" id="pet-name" maxlength="35" placeholder="e.g. Milo" required></div><button class="btn full" type="submit">Welcome them home ${I('heart')}</button></form>`,{view:()=>showAdoptPet(type)});document.getElementById('pet-form').onsubmit=e=>{e.preventDefault();run(st=>E.adoptPet(st,type,document.getElementById('pet-name').value),'A little more love in your life.');};}
function showPet(id){const p=w().pets.find(p=>p.id===id);if(!p?.alive)return toast('A little friend, always remembered.');const d=E.PET_TYPES.find(x=>x.id===p.type);modal(`${modalHeader('heart',d.name.toUpperCase()+' · AGE '+p.age,esc(p.name),'Bond '+Math.round(p.bond)+'% · Health '+Math.round(p.health)+'%')}<div class="pet-dialog-emoji">${d.emoji}</div>${[['play','Play together','Free · +12 bond'],['train','Teach a little trick','$40 · +8 bond'],['treat','Bring a favorite treat','$15 · +10 bond'],['vet','Visit the veterinarian','$180 · +30 health']].map(([action,label,hint])=>`<button class="choice-card" data-extra="pet-action" data-value="${id}" data-detail="${action}"><span><strong>${label}</strong><small>${hint} · 1 energy</small></span>${I('arrow')}</button>`).join('')}`,{view:()=>showPet(id)});}
function creatorPage(){return`<div class="creator-banner"><span class="life-kicker">YOUR VOICE. YOUR COMMUNITY.</span><h2>Make a little<br>noise in the world.</h2><p>Create posts, collaborate, earn sponsors, and grow your audience.</p></div><div class="xp-summary"><div><strong>${w().social.reduce((t,p)=>t+p.followers,0).toLocaleString()}</strong><span>Total followers</span></div><div><strong>${w().social.length}</strong><span>Your platforms</span></div><div><strong>${Math.round(s().stats.fame)}%</strong><span>Fame</span></div></div><div class="cards-2">${E.PLATFORMS.map(p=>{const account=w().social.find(a=>a.platform===p.id);return`<article class="feature-card creator-card">${iconBox(p.icon,'#b093c6')}<h3>${p.name} ${account?.verified?'✓':''}</h3><p>${account?'@'+esc(account.handle)+' · '+account.followers.toLocaleString()+' followers':({video:'Original videos and a community that comes back.',photos:'Beautiful moments. A personal point of view.',live:'Stream your interests. Meet your people.',blog:'Longer thoughts. A voice worth reading.'})[p.id]}</p>${account?`<div class="creator-actions">${[['post','Post'],['collab','Collaborate'],['promote','Promote'],['sponsor','Sponsor'],['verify','Verify']].map(([a,l])=>`<button class="btn small secondary" data-extra="social" data-value="${p.id}" data-detail="${a}">${l}</button>`).join('')}</div>`:`<button class="btn secondary" data-extra="join-social" data-value="${p.id}">Create a profile ${I('plus')}</button>`}</article>`;}).join('')}</div><div class="notice">${I('info')}<span>Collaborations cost $150; promotions cost $300. Sponsorships need 1,000 followers; verification needs 10,000. Inactive accounts lose followers each year.</span></div>`;}
function healthPage(){return`<div class="wellbeing-card"><div>${I('heart')}<h2>A little care<br>goes a long way.</h2></div><span class="wellbeing-score">${Math.round(s().stats.health)}<small>HEALTH</small></span></div><div class="section-title"><h2>How are you feeling?</h2><span class="badge">${w().conditions.length} active conditions</span></div>${w().conditions.length?`<div class="cards-2">${w().conditions.map(id=>{const c=E.CONDITIONS.find(c=>c.id===id),cost=Math.round(c.cost*(w().policies.includes('health')?.3:1));return`<article class="feature-card"><h3>${c.name}</h3><p>Untreated, reduces health by ${c.severity} points each year.</p><button class="btn secondary" data-extra="treat" data-value="${id}">Treatment · ${money(cost)}</button></article>`;}).join('')}</div>`:'<div class="health-clear">'+I('check')+' No active conditions. Keep taking care of yourself.</div>'}<div class="inline-actions"><button class="btn secondary" data-activity="doctor">${I('heart')} Checkup · $450</button><button class="btn secondary" data-activity="therapy">${I('chat')} Therapy · $180</button><button class="btn secondary" data-activity="gym">${I('activity')} Gym · $120</button></div><div class="section-title"><h2>A little peace of mind</h2></div><div class="cards-2">${E.POLICIES.map(p=>`<article class="feature-card">${iconBox('shield')}<h3>${p.name}</h3><p>${p.desc}<br>${money(p.premium)} per year; first year paid on signup.</p><button class="btn secondary" data-extra="insurance" data-value="${p.id}">${w().policies.includes(p.id)?'Cancel coverage':'Start coverage'}</button></article>`).join('')}</div>`;}
function travelPage(){return`<div class="travel-banner">${I('plane')}<h2>Go a little further.</h2><p>${w().trips.length} destinations visited. So many stories still to find.</p></div><div class="cards-2">${E.DESTINATIONS.map((d,i)=>`<article class="feature-card destination-card"><div class="destination-art tone-${i%4}">${I(i%3===0?'building':i%3===1?'sun':'tree')}<span>${['35°','48°','51°','33°'][i%4]} / ${d.name.split(', ')[1]}</span></div><div class="card-top"><h3>${d.name}</h3>${w().trips.includes(d.id)?'<span class="badge">Visited ✓</span>':''}</div><p>Make a memory · ${money(d.cost)}<br>Move here · ${money(d.cost*2)} · Age 18+</p><div class="inline-actions"><button class="btn small secondary" data-extra="visit" data-value="${d.id}">Visit ${I('plane')}</button><button class="btn small secondary" data-extra="move" data-value="${d.id}">Move here</button></div></article>`).join('')}</div><div class="notice">${I('globe')}<span>Moving changes your hometown and gives you a fresh setting. Each destination has a regional cost and wage level. Financial reports show your current regional economy.</span></div>`;}
const GOALS=[['millionaire','Make your first million','Reach $1M in net worth.','chart'],['graduate','Invest in your mind','Complete a university degree.','book'],['family','A family of your own','Welcome a child into your life.','people'],['master','Master your craft','Reach 100 in any skill.','sparkles'],['founder','Build something yourself','Launch a business.','building'],['traveler','A wider world','Visit five destinations.','globe'],['creator','Find your audience','Reach 10,000 followers on one platform.','camera'],['healthy','A little balance','Reach 95 health and happiness.','heart']];
function goalsPage(){return`<div class="section-title"><h2>What would make this life yours?</h2></div><div class="cards-2">${GOALS.map(([id,name,desc,ic])=>{const g=w().goals.find(g=>g.type===id);return`<article class="feature-card goal-card ${g?.done?'goal-complete':''}">${iconBox(g?.done?'check':ic)}<h3>${name}</h3><p>${desc}</p><button class="btn small secondary" data-extra="goal" data-value="${id}" ${g?'disabled':''}>${g?.done?'You did it ✓':g?'On your list':'Set this goal'}</button></article>`;}).join('')}</div><div class="wide-card"><h3>A quiet way to grow.</h3><p>3-year savings bonds pay 4.5% interest each year and return your principal at maturity. Your bonds count toward net worth.</p><button class="btn secondary" data-extra="bond">${I('wallet')} Buy a savings bond</button>${w().bonds.length?`<div class="data-rows">${w().bonds.map(b=>`<div class="data-row"><span>${money(b.principal)} bond · ${b.remaining} years left</span><strong>${money(b.principal*b.rate)}/year</strong></div>`).join('')}</div>`:''}</div><div class="wide-card"><h3>A little good in the world.</h3><p>Make a donation to a community cause. Lifetime giving: ${money(w().counters.donations)}.</p><button class="btn secondary" data-extra="donation">${I('hand')} Give something back</button></div>`;}
function showProjects(){modal(`${modalHeader('book','THE THINGS YOU MAKE','Your creative portfolio.','Every creative project starts earning next year, then royalties decline by 18% per year. A new project can open a new chapter.')}<div class="project-list">${w().projects.length?w().projects.map(p=>`<article class="project-row">${iconBox(E.CATEGORIES.find(c=>c.id===p.category).icon)}<div><h3>${esc(p.name)}</h3><p>Quality ${p.quality}% · ${p.years} years old · ${money(p.royalty*Math.pow(.82,Math.max(0,p.years-1)))}/year currently</p></div></article>`).join(''):'<div class="empty"><p>Practice a skill to level 30, then finish a creative project to begin collecting royalties.</p></div>'}</div>`,{large:true,view:showProjects});}
function amountDialog(kind){const bond=kind==='bond';modal(`${modalHeader(bond?'wallet':'hand',bond?'SOMETHING FOR YOUR FUTURE':'A LITTLE GOOD IN THE WORLD',bond?'A patient investment.':'Give something back.',bond?'Choose at least $100. Bonds return your principal in three years and pay 4.5% interest each year.':'Choose an amount to give to a local community cause. Giving uses 1 energy.')}<form id="amount-form"><div class="field"><label for="extra-amount">Amount in dollars</label><input class="input" id="extra-amount" type="number" min="${bond?100:1}" max="1000000000000" placeholder="e.g. 1000" required></div><button class="btn full" type="submit">${bond?'Buy bond':'Make donation'} ${I('arrow')}</button></form>`,{view:()=>amountDialog(kind)});document.getElementById('amount-form').onsubmit=e=>{e.preventDefault();run(st=>(bond?E.buyBond:E.donate)(st,Number(document.getElementById('extra-amount').value)),bond?'An investment in your future.':'A little kindness goes a long way.');};}
function showPerson(personId,original){const p=s().people.find(p=>p.id===personId&&p.alive);if(!p)return;modal(`${modalHeader('people',esc(p.role).toUpperCase(),esc(p.name),p.age+' years old · '+Math.round(p.bond)+'% bond')}<div class="interaction-grid">${[['call','chat','Call them','Free'],['compliment','sun','Give a compliment','Free'],['apologize','heart','Apologize','Free'],['dinner','coffee','Have dinner','$75'],['outing','plane','Plan an outing','$180'],['advice','book','Ask for advice','Free'],['help','hand','Offer your help','Free'],...(['Mother','Father'].includes(p.role)?[['support','wallet','Ask for support','Once yearly']]:[]),['argue','chat','Start an argument','Hurts your bond']].map(([a,ic,label,hint])=>`<button data-extra="family" data-value="${personId}" data-detail="${a}">${I(ic)}<span><strong>${label}</strong><small>${hint} · 1 energy</small></span></button>`).join('')}</div><button class="btn secondary full" style="margin-top:18px" id="more-person-options">Gifts, marriage & family ${I('arrow')}</button>`,{view:()=>showPerson(personId,original)});document.getElementById('more-person-options').onclick=original;}
function adminExtras(){return`<div class="check-row"><div><strong>Unlimited energy</strong><p>Explore every interest in the same year.</p></div><button class="toggle ${w().settings.unlimited?'on':''}" data-admin-toggle="unlimited" role="switch" aria-checked="${w().settings.unlimited}" aria-label="Unlimited energy"><i></i></button></div><div class="admin-grid"><button class="admin-option" data-admin="skills">${I('book')} Max all 26 skills</button><button class="admin-option" data-admin="cure">${I('heart')} Clear health conditions</button></div>`;}
function legacyExtras(){return`<section><div class="section-title"><h2>New little milestones</h2><span class="muted">${w().achievements.length} earned</span></div><div class="achievement-grid">${w().achievements.length?w().achievements.map(a=>`<article class="achievement earned">${I('trophy')}<h3>${esc(a.name)}</h3><p>Age ${a.age}</p></article>`).join(''):'<div class="notice">Explore skills, pets, projects, travel, and goals to earn new milestones.</div>'}</div></section>`;}
function handle(d){if(!d.extra)return false;const type=d.extra,v=d.value,detail=d.detail;switch(type){case'catalog':showCatalog(v||'all');break;case'perform':{const a=E.ACTIONS.find(a=>a.id===v);if(run(st=>E.perform(st,v),'Your story just got a little bigger.'))showCatalog(a.category);break;}case'projects':showProjects();break;case'adopt-pet':showAdoptPet(v);break;case'pet':showPet(v);break;case'pet-action':run(st=>E.petAction(st,v,detail),'A little time with your little friend.');break;case'join-social':run(st=>E.joinSocial(st,v,s().name.split(' ')[0].toLowerCase()),'Your first hello is out there.');break;case'social':run(st=>E.socialAction(st,v,detail),'Your creator story is growing.');break;case'treat':run(st=>E.clinic(st,v),'A little care makes a difference.');break;case'insurance':run(st=>E.insurance(st,v),'Your coverage has been updated.');break;case'visit':run(st=>E.visit(st,v,false),'A new memory, somewhere new.');break;case'move':confirmDialog('A new place to call home?','Move to '+E.DESTINATIONS.find(x=>x.id===v).name+'? This costs twice the trip price and uses 2 energy.',()=>run(st=>E.visit(st,v,true),'Your next chapter has a new address.'),'Make the move');break;case'goal':run(st=>E.setGoal(st,v),'A little direction for your next chapter.');break;case'bond':amountDialog('bond');break;case'donation':amountDialog('donation');break;case'family':run(st=>E.familyAction(st,v,detail),'Another moment together.');break;default:return false;}return true;}
const pages={explore:explorePage,skills:skillsPage,pets:petsPage,creator:creatorPage,health:healthPage,travel:travelPage,goals:goalsPage};
return{mobileHeader,mobileDock,lifeFeed,activityHub,adminExtras,legacyExtras,showPerson,handle,page:id=>pages[id]()};
}

<script>
/* world-ui.js */
/* Responsive World Edition screens. Catalogs render one bounded page at a time. */
function ParallelWorldUI(ctx){
'use strict';
const {E,I,esc,money,getState,run,nav,modal,modalHeader,confirmDialog,toast,chart,saveNow,getSlots,loadSlot,newLife,exportSave,importSave,familyPage}=ctx;
const s=()=>getState(),m=()=>E.sim(s()),pct=n=>(n*100).toFixed(1)+'%',num=n=>Math.round(n).toLocaleString(),find=(a,id)=>a.find(x=>x.id===id);
const filters={jobs:{q:'',category:'all',page:0,sort:'name',eligible:false},businesses:{q:'',category:'all',page:0,sort:'price'},assets:{q:'',category:'all',page:0,sort:'price',max:''},markets:{q:'',category:'all',page:0,sort:'name'}};
const metric=(title,value,sub='',ic='chart')=>`<div class="world-metric"><span>${I(ic)} ${title}</span><strong>${value}</strong><small>${sub}</small></div>`;
const btn=(action,label,value='',cls='secondary',detail='')=>`<button class="btn ${cls}" data-world="${action}" data-value="${esc(value)}" data-detail="${esc(detail)}">${label}</button>`;
const row=(k,v,cls='')=>`<div class="data-row"><span>${k}</span><strong class="${cls}">${v}</strong></div>`;
const empty=t=>`<div class="empty"><p>${t}</p></div>`;
const field=(id,label,value,type='number',props='')=>`<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" type="${type}" value="${esc(value)}" ${props}></div>`;
const select=(id,label,options,value)=>`<div class="field"><label for="${id}">${label}</label><select class="input" id="${id}">${options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`;}).join('')}</select></div>`;
const amount=id=>Number(document.getElementById(id).value),val=id=>document.getElementById(id).value;
function statbar(label,value){return`<div class="world-stat"><span>${label}</span><div><i style="width:${Math.round(value)}%"></i></div><strong>${Math.round(value)}</strong></div>`;}
function dashboard(){const st=s(),sim=m(),e=sim.economy,c=E.catalogCounts(),history=sim.financialHistory.map(h=>h.netWorth);return`<section class="world-hero"><div class="world-hero-top"><span class="edition-label">PARALLEL / WORLD EDITION</span><span class="world-status"><i></i>${sim.settings.difficulty}${sim.adminUsed?' · SANDBOX':''}</span></div><div class="world-identity"><button class="world-portrait" data-action="profile" aria-label="Edit character">${ParallelPortrait(st.appearance)}</button><div><p>Make this life yours.</p><h2>${esc(st.name)}</h2><span>${esc(st.city)} · Generation ${st.generation}</span></div><div class="world-age"><strong>${st.age}</strong><span>YEARS OLD</span></div></div><div class="world-hero-bottom"><span>${I(st.job?'briefcase':'sun')}${esc(st.job?.name||(st.education.program?st.education.program+' student':st.age<18?'A whole world ahead':st.retired?'Enjoying retirement':'Finding your next chapter'))}</span><button data-world="profile">View life profile ${I('arrow')}</button></div></section>
 <div class="world-metrics">${metric('Available cash',money(st.cash,true),'Spendable today','wallet')}${metric('Net worth',money(E.netWorth(st),true),'Assets less all personal debt')}${metric('Annual salary',money(st.job?.salary||0,true),st.job?'Before taxes and deductions':'Build a career','briefcase')}${metric('Personal debt',money(st.debt,true),'Credit score '+sim.credit,'building')}</div>
 ${st.pending?`<button class="pending-banner" data-action="event">${I('sparkles')}<span>Your next decision<strong>${esc(st.pending.title)}</strong></span>${I('arrow')}</button>`:''}
 <div class="world-two"><section class="world-card wealth-overview"><div class="section-title"><h2>A life in numbers</h2>${btn('annual','Full report')}</div><strong class="world-big-number">${money(E.netWorth(st),true)}</strong><div class="world-chart">${chart(history.length?history:st.history.map(h=>h.value),'var(--accent)')}</div><div class="world-chart-label"><span>Net worth through your life</span><span>Age ${st.age}</span></div></section><section class="world-card economy-overview"><span class="edition-label">THE WORLD AROUND YOU</span><h2>${e.phase}</h2><div class="economy-mini"><span>Inflation<strong>${pct(e.inflation)}</strong></span><span>Base rate<strong>${pct(e.interest)}</strong></span><span>Unemployment<strong>${pct(e.unemployment)}</strong></span></div><p>${esc(e.news.at(-1))}</p>${btn('bank','Open your bank','','secondary')}</section></div>
 <section class="world-choices">${[['career','briefcase','Build your career',c.careerPositions+' positions'],['businesses','building','Start something',c.businesses+' businesses'],['assets','bag','Find your next purchase',num(c.items)+' item variants'],['investments','chart','Explore the markets',c.stocks+' stocks · '+c.crypto+' crypto']].map(([page,icon,title,sub])=>`<button data-nav="${page}">${I(icon)}<strong>${title}</strong><small>${sub}</small>${I('arrow')}</button>`).join('')}</section>
 <section class="world-card"><div class="section-title"><h2>Your latest chapters</h2><button class="text-button" data-nav="legacy">Life timeline ${I('arrow')}</button></div><div class="world-timeline">${st.log.slice(0,14).map(l=>`<article><span>${l.age}<small>AGE</small></span><div><small>${esc(l.type)} · ${l.year}</small><h3>${esc(l.title)}</h3><p>${esc(l.body)}</p></div></article>`).join('')}</div></section>`;}
function catalog(kind,title,categories){const f=filters[kind];return`<section class="world-card catalog-shell" data-catalog-kind="${kind}"><div class="section-title"><h2>${title}</h2><span class="badge" id="catalog-total"></span></div><div class="world-filters"><div class="search-field"><label class="sr-only" for="world-search">Search ${kind}</label><input class="input" id="world-search" type="search" placeholder="Search ${kind==='jobs'?'careers, skills, or qualifications':kind}…" value="${esc(f.q)}"></div><select class="input" id="world-category" aria-label="Filter category">${[['all','All categories'],...categories].map(([v,t])=>`<option value="${esc(v)}" ${v===f.category?'selected':''}>${esc(t)}</option>`).join('')}</select><select class="input" id="world-sort" aria-label="Sort results">${[['name','Name A–Z'],['price',kind==='jobs'?'Salary: low to high':'Price: low to high'],['high',kind==='jobs'?'Salary: high to low':'Price: high to low']].map(([v,t])=>`<option value="${v}" ${v===f.sort?'selected':''}>${t}</option>`).join('')}</select></div>${kind==='jobs'?`<label class="world-check"><input id="world-eligible" type="checkbox" ${f.eligible?'checked':''}> Only roles I qualify for</label>`:''}${kind==='assets'?`<div class="world-budget">${field('world-max','Maximum price ($)',f.max,'number','min="0" placeholder="Any price"')}</div>`:''}<div id="world-results" aria-live="polite"></div><div class="world-pagination"><button class="btn secondary" data-world="page" data-value="-1">${I('chevron','reverse')} Previous</button><span id="world-page-number"></span><button class="btn secondary" data-world="page" data-value="1">Next ${I('chevron')}</button></div></section>`;}
function career(){const st=s(),sim=m(),j=st.job,band=j?E.salaryBand(st,j):null;return`<div class="world-metrics">${metric('Career experience',st.careerYears+' years','Across all employers','briefcase')}${metric('Professional reputation',Math.round(sim.traits.reputation)+'/100','Networking opens opportunities','people')}${metric('Stress',Math.round(sim.traits.stress)+'/100',sim.traits.stress>75?'Take time to recover':'Keep a sustainable pace','heart')}${metric('Offers waiting',sim.career.offers.length,'Expire when you age up','chat')}</div>
 ${j?`<section class="world-card job-current"><div class="card-top"><div><span class="edition-label">YOUR CURRENT ROLE</span><h2>${esc(j.name)}</h2><p>${esc(j.field)} · ${j.years} years in role · ${j.benefits.leave} days leave</p></div><span class="badge">${money(j.salary)}/yr</span></div>${statbar('Performance',j.performance)}<div class="salary-band"><span>Starting ${money(band.min,true)}</span><div><i style="width:${Math.min(100,j.salary/band.max*100)}%"></i></div><span>Ceiling ${money(band.max,true)}</span></div><div class="inline-actions">${btn('career-action','Focused work · 1 energy','work','')}${btn('raise','Request a raise')}${btn('career-action','Promotion review','promote')}${btn('career-action','Network · $150','network')}${btn('career-action','Take leave','leave')}${st.age>=60?btn('career-action','Retire','retire'):''}<button class="btn danger" data-action="quit">Resign</button></div><p class="file-note">Raise requests: once per year across all employers, up to 10%. Promotions require relevant experience, skills, and a review. Employer contributes ${pct(j.benefits.pension)} of salary to retirement.</p>${sim.career.lastRaise?`<div class="world-response"><strong>Last salary review: ${esc(sim.career.lastRaise.response)}</strong><p>Requested ${sim.career.lastRaise.requested}% · offered ${sim.career.lastRaise.offered}%. ${esc(sim.career.lastRaise.reason)}</p></div>`:''}</section>`:`<section class="world-card"><h2>${st.age<16?'A future full of possibilities':st.retired?'Your time, your way':'Your next chapter starts with an interview'}</h2><p>${st.age<16?'School and skills now will open more doors later.':'Interview for several roles, compare offers, and negotiate before accepting. You can interview while employed.'}</p>${st.age<18?`<div class="inline-actions">${['balanced','academic','creative','sports'].map(f=>btn('school',f[0].toUpperCase()+f.slice(1),f,sim.schoolFocus===f?'':'secondary')).join('')}</div>`:''}</section>`}
 ${sim.career.offers.length?`<section class="world-card"><h2>Your offers</h2>${sim.career.offers.map(o=>`<div class="offer-row"><div><h3>${esc(find(E.JOBS,o.jobId).name)}</h3><p>${esc(o.company)} · ${money(o.salary)}/year · expires at next birthday</p></div><div class="inline-actions">${btn('offer','Accept',o.id,'','accept')}${btn('offer',o.negotiated?'Negotiated':'Negotiate',o.id,'secondary','negotiate')}${btn('offer','Decline',o.id,'secondary','decline')}</div></div>`).join('')}</section>`:''}
 ${catalog('jobs','Find work that matters',E.SECTORS.map(x=>[x.id,x.name]))}
 <section class="world-card"><div class="section-title"><h2>Education & qualifications</h2>${btn('scholarship','Apply for scholarship')}</div><p>${st.education.program?'Studying '+esc(st.education.program)+' · '+st.education.remaining+' years remaining.':'Degrees, certificates, and supervised experience unlock advanced roles.'}</p>${sim.career.scholarship?`<p class="positive">Scholarship available: ${money(sim.career.scholarship)}</p>`:''}${st.education.program?'<button class="btn secondary" data-action="dropout">Leave program</button>':`<div class="world-study-grid">${E.PROGRAMS.map(p=>`<button data-enroll="${esc(p.name)}"><strong>${esc(p.name)}</strong><span>${p.years} years · ${money(p.cost)} total</span><small>${st.education.degrees.includes(p.name)?'Completed ✓':p.smart+' smarts required'}</small></button>`).join('')}</div>`}<div class="notice">${I('book')}<span>Medicine takes 8 years of study. A neurosurgeon then needs 8 years of supervised medical work and a medicine certificate. Earn skill certificates in <button class="text-button" data-nav="skills">Skills & interests</button>.</span></div></section>`;}
function markets(){const st=s(),sim=m(),pv=E.portfolio(st),basis=Object.values(st.holdings).reduce((t,h)=>t+h.cost,0);return`<div class="world-metrics">${metric('Portfolio',money(pv,true),'Stocks, funds, and crypto')}${metric('Unrealized gain',money(pv-basis,true),'Market value less cost basis')}${metric('Realized gain',money(sim.investment.realized,true),'Lifetime closed positions')}${metric('Dividends',money(sim.investment.dividends,true),'Lifetime distributions','wallet')}</div><div class="world-two"><section class="world-card"><div class="section-title"><h2>Your allocation</h2>${btn('bank','Savings & retirement')}</div>${['stock','fund','crypto'].map(kind=>{const value=st.markets.filter(x=>x.kind===kind).reduce((t,x)=>t+(st.holdings[x.id]?.qty||0)*x.price,0);return`<div class="allocation-row"><span>${kind==='stock'?'Stocks':kind==='fund'?'Funds':'Crypto'}</span><div><i style="width:${pv?value/pv*100:0}%"></i></div><strong>${money(value,true)}</strong></div>`;}).join('')}<p class="file-note">Capital gains tax paid: ${money(sim.investment.taxPaid)}. Realized losses offset future gains.</p></section><section class="world-card"><h2>Market briefing</h2>${sim.economy.news.map(t=>`<p class="market-news">${I('globe')}${esc(t)}</p>`).join('')}<div class="inline-actions"><button class="btn secondary" data-extra="bond">3-year bonds · 4.5%</button>${btn('bank','Bank accounts')}</div></section></div>${catalog('markets','Explore the market',[['holdings','My portfolio'],['watchlist','My watchlist'],['stock','Stocks'],['fund','Diversified funds'],['crypto','Crypto'],...E.SECTORS.map(x=>[x.id,x.name])])}<p class="file-note">Every price is simulated. Companies can fail permanently. Crypto can crash. Returns are never guaranteed. Diversified funds and savings use different risk models.</p>`;}
function businesses(){const st=s();return`<div class="world-metrics">${metric('Businesses',st.businesses.length,'Founder & owner','building')}${metric('Revenue',money(st.businesses.reduce((t,b)=>t+b.revenue,0),true),'Last completed year')}${metric('Company profits',money(st.businesses.reduce((t,b)=>t+b.profit,0),true),'After business tax')}${metric('Business equity',money(st.businesses.reduce((t,b)=>t+b.value,0),true),'Includes working capital')}</div>${st.businesses.length?`<section><div class="section-title"><h2>Your companies</h2></div><div class="world-cards">${st.businesses.map(b=>{const d=find(E.INDUSTRIES,b.industry),f=m().firms[b.id];return`<article class="world-list-card"><div class="catalog-illustration">${I(d.icon)}<span>${esc(d.group)}</span></div><div class="card-top"><h3>${esc(b.name)}</h3><span class="badge">Year ${b.years}</span></div><p>${esc(d.name)} · ${b.staff} employees · ${f.locations} locations</p><div class="business-stats"><div><span>Revenue</span><strong>${money(b.revenue,true)}</strong></div><div><span>Profit</span><strong class="${b.profit<0?'negative':'positive'}">${money(b.profit,true)}</strong></div><div><span>Company cash</span><strong>${money(f.cash,true)}</strong></div></div>${f.distress?'<p class="negative">Cash shortfall: fund the business before its next year.</p>':''}${btn('company','Manage company '+I('arrow'),b.id,'full')}</article>`;}).join('')}</div></section>`:''}${catalog('businesses','Find your next venture',E.BUSINESS_MODELS.map(x=>[x.id,x.name]))}<p class="file-note">Startup costs include equipment and working capital. Payroll, supplies, energy, taxes, and loans are paid by the company. Only owner distributions reach your personal cash.</p>`;}
function assets(){const st=s();return`<div class="world-metrics">${metric('Owned assets',money(st.assets.reduce((t,a)=>t+a.value,0),true),st.assets.length+' possessions','home')}${metric('Ownership costs',money(st.assets.reduce((t,a)=>t+a.upkeep*m().economy.cpi,0),true),'Annual maintenance, tax & insurance')}${metric('Rental potential',money(st.assets.filter(a=>a.rented).reduce((t,a)=>t+a.rent*m().economy.cpi,0),true),'Before vacancy and costs')}${metric('Credit score',m().credit,'620 needed for financing','wallet')}</div>${st.assets.length?`<section class="world-card"><div class="section-title"><h2>Your collection</h2>${btn('bank','Loans & mortgages')}</div><div class="owned-list">${st.assets.map(a=>`<button data-world="owned" data-value="${a.id}">${I(a.icon)}<span><strong>${esc(a.name)}</strong><small>${money(a.value,true)} value · ${a.rented?'Rented':'Personal use'} · condition ${Math.round(m().assetMeta[a.id].condition)}%</small></span>${I('arrow')}</button>`).join('')}</div></section>`:''}${catalog('assets','The marketplace',[...new Set(E.PROPERTIES.map(a=>a.group))].map(x=>[x,x]))}`;}
function statistics(){const st=s(),sim=m(),history=sim.financialHistory;return`<div class="world-metrics">${metric('Lifetime earnings',money(sim.statistics.earned,true),'Salary and annual distributions')}${metric('Taxes paid',money(sim.statistics.taxes+sim.investment.taxPaid,true),'Income plus capital gains')}${metric('Years worked',sim.statistics.yearsWorked,'Across your career','briefcase')}${metric('Companies sold',sim.statistics.companiesSold,'Completed exits','building')}</div><div class="world-two">${[['Income progression','income'],['Investment value','portfolio'],['Annual spending','expenses'],['Personal debt','debt']].map(([title,key])=>`<section class="world-card"><h2>${title}</h2><div class="world-chart">${chart(history.length?history.map(h=>h[key]):[0,0],'var(--accent)')}</div><p class="file-note">${history.length?money(history.at(-1)[key])+' in the latest year':'Age up to begin your financial history.'}</p></section>`).join('')}</div><section class="world-card"><h2>Career history</h2>${sim.career.history.length?sim.career.history.slice().reverse().map(h=>row('Age '+h.age+' · '+esc(h.reason),esc(h.title)+' · '+money(h.salary))).join(''):empty('Your first career chapter is still ahead.')}</section><section class="world-card"><h2>Your character</h2>${Object.entries(sim.traits).map(([k,v])=>statbar(k[0].toUpperCase()+k.slice(1),v)).join('')}<p class="file-note">Discipline supports work performance and scholarships. Charisma and reputation help interviews. High stress harms health and performance. Family and friends can improve hiring chances.</p></section>`;}

function family(){const h=m().household,spouse=s().people.find(p=>p.alive&&p.role==='Spouse');return`<section class="world-card"><div class="section-title"><h2>A home you build together</h2>${btn('household','Household decisions')}</div><div class="world-metrics compact">${metric('Household budget',h.budget,'Changes spending and wellbeing','home')}${metric('Family finances',h.finances,spouse?'Partner income contributes when shared':'Marriage enables shared contributions','people')}${metric('Education fund',money(h.educationFund,true),'Set money aside for family learning','book')}${metric('Inheritance',h.inheritable?'Enabled':'Fresh start',Math.round(h.charity*100)+'% charitable bequest','tree')}</div><p class="file-note">Friendships and close family support wellbeing. Shared spouses contribute part of their disposable income; shared gains may require a settlement after separation.</p></section>${familyPage()}`;}
function household(){const h=m().household;modal(`${modalHeader('home','FAMILY & FUTURE','Decide what matters at home.','Your choices affect yearly spending, wellbeing, savings, and the next generation.')}<form id="household-form"><div class="field-grid">${select('household-budget','Lifestyle budget',[['essentials','Essentials · 20% lower basic costs'],['balanced','Balanced'],['comfortable','Comfortable · 30% higher basic costs'],['luxury','Luxury · double basic costs']],h.budget)}${select('household-finances','Partner finances',[['separate','Separate finances'],['shared','Shared household contribution']],h.finances)}${select('household-inherit','Next generation inheritance',[[1,'Pass on the estate'],[0,'Begin the next life without an estate']],h.inheritable?1:0)}${select('household-charity','Charitable bequest',[[0,'0%'],[.1,'10%'],[.25,'25%'],[.5,'50%'],[1,'100%']],h.charity)}</div><button class="btn full" type="submit">Save household plan</button></form><h3 style="margin-top:25px">Family education fund · ${money(h.educationFund)}</h3><p class="file-note">A separate cash reserve for future tuition or family learning. It counts in your estate and is available for withdrawal.</p><div class="inline-actions">${btn('education-fund','Add to fund','deposit')}${btn('education-fund','Withdraw','withdraw')}</div><p class="file-note">After the charitable bequest, an inherited estate is divided equally among living children. You continue as one child with their share. Retirement is protected during the game’s bankruptcy; the family fund is not.</p>`,{view:household});document.getElementById('household-form').onsubmit=e=>{e.preventDefault();run(st=>E.household(st,{budget:val('household-budget'),finances:val('household-finances'),inheritable:val('household-inherit')==='1',charity:amount('household-charity')}),'Household plan saved.');};}

function settings(){const sim=m();return`<section class="world-card"><span class="edition-label">MAKE IT YOURS</span><h2>Your world, your pace.</h2><form id="world-settings"><div class="field-grid">${select('setting-theme','Appearance',['dark','light'],sim.settings.theme)}${select('setting-accent','Accent color',['mint','violet','blue','amber'],sim.settings.accent)}${select('setting-difficulty','Financial difficulty',Object.keys(E.DIFFICULTY),sim.settings.difficulty)}${select('setting-retirement','Salary saved for retirement',[[0,'0%'],[.05,'5%'],[.1,'10%'],[.15,'15%'],[.2,'20%'],[.3,'30%']],sim.retirementRate)}</div><label class="world-check"><input id="setting-motion" type="checkbox" ${sim.settings.reducedMotion?'checked':''}> Reduce animations</label><button class="btn" type="submit">Save settings ${I('check')}</button></form><div class="notice">${I('info')}<span>Realistic is the default. Casual lowers living costs and risk; Hardcore makes both tougher. Your existing cash and possessions stay intact when you change difficulty.</span></div></section><section class="world-card"><h2>Keep every chapter</h2><p>Five browser save slots. Export a JSON backup to move between devices.</p><div class="inline-actions">${btn('saves','Manage saved lives')}${btn('save-now','Save now')}<button class="btn secondary" data-action="admin">Sandbox panel</button></div>${sim.adminUsed?'<p class="sandbox-note">SANDBOX LIFE · Admin controls have been used in this life.</p>':''}</section>`;}
function mount(){const shell=document.querySelector('[data-catalog-kind]');if(shell){const kind=shell.dataset.catalogKind,f=filters[kind];const update=()=>{f.q=val('world-search');f.category=val('world-category');f.sort=val('world-sort');if(kind==='jobs')f.eligible=document.getElementById('world-eligible').checked;if(kind==='assets')f.max=val('world-max');f.page=0;renderResults(kind);};for(const id of ['world-search','world-category','world-sort','world-eligible','world-max']){const el=document.getElementById(id);if(el)el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'?'change':'input',update);}renderResults(kind);}
 const form=document.getElementById('world-settings');if(form)form.onsubmit=e=>{e.preventDefault();run(st=>E.setSettings(st,{theme:val('setting-theme'),accent:val('setting-accent'),difficulty:val('setting-difficulty'),retirementRate:amount('setting-retirement'),reducedMotion:document.getElementById('setting-motion').checked}),'Settings saved.');};}
function renderResults(kind){const f=filters[kind],st=s(),q=f.q.toLowerCase().trim();let data=kind==='jobs'?E.JOBS:kind==='businesses'?E.INDUSTRIES:kind==='assets'?E.PROPERTIES:st.markets;
 data=data.filter(d=>{const text=kind==='jobs'?[d.name,d.field,d.degree,d.skill].join(' '):kind==='assets'?[d.name,d.group,d.region].join(' '):kind==='businesses'?[d.name,d.group,d.mode].join(' '):[d.name,d.id,d.sector].join(' ');if(q&&!text.toLowerCase().includes(q))return false;if(kind==='jobs')return(f.category==='all'||d.sector===f.category)&&(!f.eligible||!E.jobRequirements(st,d).length);if(kind==='businesses')return f.category==='all'||d.mode===f.category;if(kind==='assets')return(f.category==='all'||d.group===f.category)&&(!f.max||E.priceOf(st,d)<=Number(f.max));return f.category==='all'||f.category==='holdings'&&(st.holdings[d.id]?.qty||0)>0||f.category==='watchlist'&&m().investment.watchlist.includes(d.id)||d.kind===f.category||d.sectorId===f.category;});
 const price=d=>kind==='jobs'?E.salaryBand(st,d).typical:kind==='businesses'?d.cost:kind==='assets'?E.priceOf(st,d):d.price;
 data.sort((a,b)=>f.sort==='name'?a.name.localeCompare(b.name):(price(a)-price(b))*(f.sort==='high'?-1:1));const total=data.length,pages=Math.max(1,Math.ceil(total/24));f.page=Math.max(0,Math.min(f.page,pages-1));const visible=data.slice(f.page*24,f.page*24+24);document.getElementById('catalog-total').textContent=num(total)+' results';document.getElementById('world-page-number').textContent=`${f.page+1} / ${pages}`;document.querySelector('[data-world="page"][data-value="-1"]').disabled=f.page===0;document.querySelector('[data-world="page"][data-value="1"]').disabled=f.page>=pages-1;
 const html=visible.map(d=>{
  if(kind==='jobs'){const reasons=E.jobRequirements(st,d),band=E.salaryBand(st,d);return`<article class="world-list-card"><div class="world-card-kicker">${I(d.icon)}${esc(d.field)}<span>${reasons.length?'Requirements':'Eligible ✓'}</span></div><h3>${esc(d.name)}</h3><p>${money(band.min,true)}–${money(band.max,true)} / year</p><small>${esc(d.degree||'No degree required')} · ${d.experience||0}+ years experience</small><div class="catalog-card-bottom">${btn('job','View & interview',d.id,'secondary full')}</div></article>`;}
  if(kind==='businesses')return`<article class="world-list-card"><div class="catalog-illustration">${I(d.icon)}<span>${esc(d.group)}</span></div><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p><div class="catalog-card-bottom"><strong>${money(d.cost,true)}</strong>${btn('found','Start',d.id)}</div></article>`;
  if(kind==='assets')return`<article class="world-list-card"><div class="catalog-illustration asset-art">${I(d.icon)}<span>${esc(d.type)} / ${esc(d.region)}</span></div><h3>${esc(d.name)}</h3><p>Quality ${d.quality} · Condition ${d.condition}%</p><small>${money(d.upkeep*m().economy.cpi,true)}/year ownership costs</small><div class="catalog-card-bottom"><strong>${money(E.priceOf(st,d),true)}</strong>${btn('buy-item','View',d.id)}</div></article>`;
