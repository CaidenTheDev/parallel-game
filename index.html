function nav(to){page=to;sidebarOpen=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function chart(values,color='#8ca66b',area=true,cls=''){if(values.length===1)values=[values[0],values[0]];const w=300,h=90,p=4,min=Math.min(...values),max=Math.max(...values),range=Math.max(.000000001,max-min);const pts=values.map((v,i)=>`${p+i*(w-p*2)/(values.length-1)},${h-p-(v-min)/range*(h-p*2)}`);return`<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${area?`<path d="M${pts.join(' L')} L${w-p} ${h} L${p} ${h}Z" fill="${color}" opacity=".09"/>`:''}<path d="M${pts.join(' L')}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function scene(){return`<div class="hero-scene" aria-hidden="true"><svg viewBox="0 0 350 220" fill="none"><circle cx="255" cy="57" r="29" fill="#e1e9c8"/><circle cx="255" cy="57" r="40" stroke="#dce6c9" stroke-dasharray="2 7"/><path d="M0 220V183L73 150 140 179 230 151 350 195v25" fill="#dce6cd"/><path d="m22 195 105-50 166 55-84 40" fill="#d4e0c0"/><path d="m68 165 70-34 122 44-68 37z" fill="#ecf1e2"/><path d="m126 144 31-16 31 11-30 16z" fill="#cad9b2"/><path d="m126 144 32 11v40l-32-12z" fill="#9eb585"/><path d="m158 155 30-16v40l-30 16z" fill="#c0d2a6"/><path d="m119 143 36-21 39 14-36 22z" fill="#f4f6eb"/><path d="m155 122 39 14v4l-39-14z" fill="#a8bd8c"/><path d="m119 143 36-21v4l-36 21z" fill="#d6e2c1"/><path d="m130 152 8 3v10l-8-3zM144 157l8 3v10l-8-3zM130 170l8 3v10l-8-3zM144 175l8 3v10l-8-3z" fill="#e3eccd"/><path d="m165 159 8-4v11l-8 4zM177 152l7-3v11l-7 4z" fill="#6f8f5c"/><path d="m225 161 32-15v-56l-32 15z" fill="#ccdab7"/><path d="m195 150 30 11v-56l-30-12z" fill="#a4b98b"/><path d="m195 93 31-15 31 12-32 15z" fill="#eff4e5"/><path d="m203 104 6 2v8l-6-2zM215 108l5 2v8l-5-2zM203 119l6 2v8l-6-2zM215 123l5 2v8l-5-2zM203 134l6 2v8l-6-2zM215 138l5 2v8l-5-2z" fill="#dbe6c8"/><path d="m232 110 6-3v8l-6 3zM244 104l6-3v8l-6 3zM232 126l6-3v8l-6 3zM244 120l6-3v8l-6 3zM232 142l6-3v8l-6 3zM244 136l6-3v8l-6 3z" fill="#8ca775"/><path d="m63 165 26 10v-28l-26-10z" fill="#b4c69c"/><path d="m89 175 25-14v-28l-25 14z" fill="#d1debc"/><path d="m57 138 25-31 38 25-31 19z" fill="#789663"/><path d="m57 138 25-31 5 5-24 28z" fill="#92ab7c"/><path d="m71 151 9 3v16l-9-3z" fill="#eff4e4"/><path d="m96 149 9-4v9l-9 4z" fill="#8ea77b"/><path d="m282 183v-32M40 185v-32M177 210v-24" stroke="#92a77e" stroke-width="3"/><ellipse cx="282" cy="142" rx="13" ry="22" fill="#a5bc87"/><ellipse cx="40" cy="145" rx="11" ry="19" fill="#aec395"/><ellipse cx="177" cy="178" rx="9" ry="17" fill="#a5bd87"/><path d="m100 201 23 8M205 189l16 6M260 198l13 5" stroke="#f5f8ef" stroke-width="3" stroke-linecap="round"/><path d="m311 90-6-3M314 82l3-5M323 90l5 2M171 60l4-4M179 61l-3-4" stroke="#c5d4ac" stroke-width="1.5"/><path d="M45 83h25M53 76h23M296 119h33" stroke="#d6e1c2" stroke-width="2" stroke-linecap="round"/></svg></div>`;}
function avatar(){return ParallelPortrait(state.appearance);}
const navItems=[['overview','grid','Overview'],['career','briefcase','Career & education'],['relationships','people','Relationships'],['investments','chart','Investments'],['businesses','building','Businesses'],['assets','home','Assets & lifestyle'],['activities','sun','Activities'],['legacy','trophy','Your legacy'],['explore','globe','Explore more'],['statistics','chart','Lifetime statistics'],['settings','sliders','Settings']];
function render(){
 const s=state;E.ensure(s);E.refresh(s);W.applyTheme();document.title='Parallel — '+s.name+'’s life';
 document.getElementById('app').innerHTML=`<div class="shell">${sidebarOpen?'<div class="sidebar-backdrop" data-action="menu"></div>':''}<aside class="sidebar ${sidebarOpen?'open':''}"><a class="brand" href="#" data-nav="overview"><span class="brand-mark"><i></i><i></i></span>parallel<small>™</small></a><div class="sidebar-tag">One life. Endless possibilities.</div><div class="nav-label">YOUR WORLD</div><nav class="nav" aria-label="Main navigation">${navItems.map(([id,ic,name])=>`<button class="nav-btn ${page===id?'active':''}" data-nav="${id}" ${page===id?'aria-current="page"':''}>${I(ic)}${name}</button>`).join('')}</nav><div class="sidebar-bottom"><button class="sandbox-btn" data-action="admin">${I('sliders')}Sandbox panel <span class="tag">GOD MODE</span></button><div class="bottom-links"><button data-action="save-menu">${I('download')} Save & load</button><button data-action="new">New life ${I('plus')}</button></div><div class="sidebar-credit">World Edition · v3.0</div></div></aside><div class="workspace">${X.mobileHeader(page)}<header class="topbar"><div class="breadcrumb"><button class="mobile-menu" data-action="menu" aria-label="Open navigation">${I('menu')}</button>${I('home')} Your life <span>/</span> <strong>${navItems.find(n=>n[0]===page)?.[2]||page[0].toUpperCase()+page.slice(1)}</strong></div><div class="top-right"><span class="saved"><i class="dot"></i> ${s.sim.adminUsed?'Sandbox life · Autosaved':'Progress autosaves'}</span><button class="top-avatar" data-action="profile" aria-label="Your character">${esc(initials(s.name))}</button></div></header><main class="page-wrap" data-page="${page}"><div class="page-heading"><div><div class="eyebrow">${page==='overview'?'A WORLD OF POSSIBILITIES':'MAKE IT YOURS'}</div><h1>${titleMap[page]||({statistics:'Every chapter adds up.',settings:'Make yourself at home.'})[page]||page}</h1><p class="page-sub">${descMap[page]||({statistics:'Follow your growth, your work, and your legacy.',settings:'Appearance, difficulty, and the stories you save.'})[page]||''}</p></div><div class="date-chip">${I('calendar')} ${s.birthYear+s.age} <span class="fade-text">/</span> Chapter ${s.age}</div></div><div class="main-grid"><div class="main-col page-content">${content()}</div><aside class="right-rail" aria-label="Character and stats">${profilePanel()}${agePanel()}${vitalsPanel()}${wealthPanel()}</aside></div><footer class="page-footer"><span>${I('leaf')} YOUR STORY IS STILL BEING WRITTEN.</span><span>Simulated world. Real possibilities.</span></footer></main>${X.mobileDock(page)}</div></div>`;W.mount();
}
function profilePanel(){const s=state;const status=s.dead?'Life complete':s.retired?'Retired':s.job?.name||s.education.program+' student';return`<section class="panel"><div class="profile-top"><div class="profile-avatar">${avatar()}</div><div><div class="profile-name">${esc(s.name)}</div><div class="profile-location">${I('pin')} ${esc(s.city)}</div></div></div><div class="profile-facts"><div><div class="fact-label">Age</div><div class="fact-value">${s.age} <span class="age-tag">${s.dead?'Remembered':s.immortal?'Immortal':s.age<18?'Growing up':s.age<30?'Young adult':s.age<60?'Adult':'Golden years'}</span></div></div><div><div class="fact-label">Occupation</div><div class="fact-value">${esc(s.dead?'Life complete':s.retired?'Retired':s.job?.name||(s.education.program?'Student':s.age<18?'Student':'Finding your path'))}</div></div></div></section>`;}
function vitalsPanel(){return`<section class="panel"><div class="panel-head"><h3>Your vital signs</h3>${I('activity')}</div>${[['health','heart','Health','#95b47c'],['happiness','sun','Happiness','#cfb775'],['smarts','book','Smarts','#a7afcf'],['looks','sparkles','Looks','#ccacaa']].map(([id,ic,label,color])=>`<div class="vital" style="--stat:${color}"><div class="vital-line"><span class="vital-name">${I(ic)}${label}</span><strong>${Math.round(state.stats[id])}%</strong></div><div class="bar" role="progressbar" aria-label="${label}" aria-valuenow="${Math.round(state.stats[id])}" aria-valuemin="0" aria-valuemax="100"><span style="width:${state.stats[id]}%"></span></div></div>`).join('')}</section>`;}
function wealthPanel(){const s=state,nw=E.netWorth(s);const data=s.history.map(p=>p.value);data[data.length-1]=nw;return`<section class="panel wealth-panel"><div class="panel-head" style="margin-bottom:8px"><h3>Your net worth</h3>${I('wallet')}</div><div class="wealth-number mono">${money(nw,nw>=1e6)}</div><div class="wealth-label">${s.age<=18?'A promising beginning.':'Every chapter adds up.'}</div><div class="wealth-chart">${chart(data)}</div><div class="wealth-detail"><span>Available cash</span><strong class="mono">${money(s.cash,true)}</strong></div></section>`;}
function ageButton(){return`<button class="age-button" data-action="age">${state.dead?'Continue your legacy':state.pending?'Make your choice':'Age up a year'} ${I(state.dead?'tree':'plus')}</button>`;}
function agePanel(){return`<section class="age-panel"><div class="energy-line"><span>This year’s energy</span><div class="energy-dots" aria-label="${state.ap} energy remaining">${Array.from({length:12},(_,i)=>`<i class="${i>=state.ap?'off':''}"></i>`).join('')}</div><span>${state.world.settings.unlimited?'∞':state.ap+'/'+E.energyMax(state)}</span></div>${ageButton()}<p class="age-hint">A new year. New possibilities.</p></section>`;}
function content(){const expanded=W.page(page);if(expanded!==null)return expanded;if(['explore','skills','pets','creator','health','travel','goals'].includes(page))return X.page(page);return({overview:overviewPage,career:careerPage,relationships:relationshipsPage,investments:investmentsPage,businesses:businessPage,assets:assetsPage,activities:activitiesPage,legacy:legacyPage}[page]||overviewPage)();}
function quickLinks(){return`<section><div class="section-title"><h2>Where will life take you?</h2><span class="muted">A little ambition goes a long way.</span></div><div class="quick-grid">${[['career','briefcase','Find your calling','Career & education'],['investments','chart','Grow your wealth','Stocks & crypto'],['businesses','building','Build an empire','Start a business'],['relationships','people','Make connections','Family & friends']].map(([id,ic,title,sub])=>`<button class="quick-card" data-nav="${id}"><div class="quick-icon">${I(ic)}</div>${I('arrow')}<h3>${title}</h3><p>${sub}</p></button>`).join('')}</div></section>`;}
function journal(limit=12){const logs=state.log.filter(l=>journalTab==='all'||journalTab==='milestones'&&['milestone','achievement','year'].includes(l.type)||journalTab==='choices'&&l.type==='choice').slice(0,limit);return`<section class="journal"><div class="journal-heading"><h2>The story so far</h2><span>${state.log.length} moments & counting</span></div><div class="filter-tabs"><button data-filter="all" class="${journalTab==='all'?'selected':''}">All moments</button><button data-filter="milestones" class="${journalTab==='milestones'?'selected':''}">Milestones</button><button data-filter="choices" class="${journalTab==='choices'?'selected':''}">Your choices</button></div><div class="timeline">${logs.length?logs.map(l=>`<article class="timeline-row"><div class="timeline-age">${l.age}<small>AGE</small></div><div class="timeline-content"><div class="event-category"><span>${l.type==='milestone'?'A new beginning':l.type==='year'?'A new chapter':l.type}</span><span>${l.year}</span></div><h3>${esc(l.title)}</h3><p>${esc(l.body)}</p></div></article>`).join(''):'<div class="empty"><p>Your next chapter is waiting to happen.</p></div>'}</div></section>`;}
function overviewPage(){return X.lifeFeed();}
const empty=(ic,title,text,button='')=>`<div class="empty">${I(ic)}<h3>${title}</h3><p>${text}</p>${button}</div>`;
function careerPage(){const s=state;return`${s.job?`<section class="wide-card"><div class="card-top"><div><div class="eyebrow">YOUR CURRENT CHAPTER</div><h2>${esc(s.job.name)}</h2></div><span class="badge">Level ${s.job.rank}</span></div><p>${esc(s.job.field)} · ${s.job.years} years in role · ${money(s.job.salary)} per year</p><div class="vital"><div class="vital-line"><span class="vital-name">Work performance</span><strong>${s.job.performance}%</strong></div><div class="bar"><span style="width:${s.job.performance}%"></span></div></div><div class="inline-actions"><button class="btn" data-career="work">${I('bolt')} Work harder · 1 energy</button><button class="btn secondary" data-career="raise">Ask for a promotion</button>${s.age>=60?'<button class="btn secondary" data-career="retire">Retire</button>':''}<button class="btn danger" data-action="quit">Resign</button></div></section>`:s.retired?empty('sun','Enjoy the chapter you earned.','Your annual pension is $18,000. There is plenty of living left to do.'):empty('briefcase',s.age<16?'Your career is still ahead.':'Your next opportunity is out there.',s.age<16?'Enjoy your early years. Part-time jobs open at 16; most careers open at 18.':'Find a role that fits your skills, or head to university and unlock more paths.')}
 ${s.education.program?`<div class="wide-card"><div class="eyebrow">IN THE MAKING</div><h2>${esc(s.education.program)} student</h2><p>${s.education.remaining} years until graduation. Tuition is already covered. Keep your curiosity alive.</p><button class="btn secondary" data-action="study">${I('book')} Study harder · 1 energy</button> <button class="btn danger" data-action="dropout">Leave program</button></div>`:''}
 <section><div class="section-title"><h2>A world of opportunities</h2><span class="muted">${s.careerYears} years of experience</span></div><input class="input career-search" type="search" id="career-search" aria-label="Search careers" placeholder="Search 51 careers…"><div class="cards-2">${E.JOBS.map(j=>{const qualified=s.stats.smarts>=j.smart&&(!j.degree||j.degree==='High school'&&s.age>=18||s.education.degrees.includes(j.degree))&&s.careerYears>=(j.experience||0)&&s.age>=16;return`<article class="feature-card" data-job-card="${j.id}"><div class="card-top"><div class="quick-icon">${I(j.icon)}</div><span class="badge ${qualified?'':'warn'}">${qualified?'Qualified':'Requirements'}</span></div><h3>${j.name}</h3><p>${j.field} · ${j.degree||'No degree needed'}${j.experience?' · '+j.experience+' yrs experience':''}<br>${j.smart?j.smart+' smarts required':'A great place to begin'}</p><div class="card-bottom"><div class="price">${money(j.salary,true)}<small class="muted" style="font:9px var(--font)"> / year</small></div><button class="btn small secondary" data-job="${j.id}" ${s.job||s.education.program?'disabled':''}>Apply ${I('arrow')}</button></div></article>`;}).join('')}</div></section>
 <section><div class="section-title"><h2>Invest in yourself</h2><span class="muted">Education opens doors</span></div><div class="cards-2">${E.PROGRAMS.map(p=>`<article class="feature-card"><div class="quick-icon">${I('book')}</div><h3>${p.name}</h3><p>${p.years}-year program · ${p.smart}+ smarts<br>${money(p.cost)} total tuition · student loans available</p><button class="btn small secondary" data-enroll="${p.name}" ${s.education.program||s.education.degrees.includes(p.name)?'disabled':''}>${s.education.degrees.includes(p.name)?'Degree earned':s.education.program?'Currently studying':'Explore program'} ${I('arrow')}</button></article>`).join('')}</div></section>`;}
function relationshipsPage(){const s=state,partner=s.people.find(p=>p.alive&&['Partner','Spouse'].includes(p.role));const groups=[['Your family',s.people.filter(p=>!['Friend','Partner','Spouse','Ex-partner'].includes(p.role))],['Your circle',s.people.filter(p=>['Friend','Partner','Spouse','Ex-partner'].includes(p.role))]];return`<div class="inline-actions"><button class="btn" data-action="meet">${I('people')} Make a new friend</button><button class="btn secondary" data-action="date" ${partner?'disabled':''}>${I('heart')} Go on a date · $80</button><button class="btn secondary" data-action="adopt">Grow your family</button></div>${groups.map(([title,people])=>`<section><div class="section-title"><h2>${title}</h2><span class="muted">${people.filter(p=>p.alive).length} connections</span></div><div class="panel">${people.map(p=>`<div class="list-row ${p.alive?'':'gray'}"><div class="person-avatar ${p.role!=='Friend'?'family':''}">${esc(initials(p.name))}</div><div class="list-main"><h3>${esc(p.name)} ${p.alive?'':'✧'}</h3><p>${esc(p.role)} · ${p.age} years old${p.alive?'':' · In memory'}</p></div><div class="person-bond"><small>${Math.round(p.bond)}% bond</small><div class="bar"><span style="width:${p.bond}%;--stat:#a2b981"></span></div></div><button class="btn small secondary" data-person="${p.id}" ${p.alive?'':'disabled'}>Spend time</button></div>`).join('')}</div></section>`).join('')}<div class="notice">${I('heart')}<span>Relationships need a little care each year. Spend time together, give gifts, marry a partner, or welcome a child. Living children can inherit your legacy.</span></div>`;}
function investmentsPage(){const s=state,pv=E.portfolio(s),cost=Object.values(s.holdings).reduce((t,h)=>t+h.cost,0);const list=s.markets.filter(m=>marketTab==='holdings'?(s.holdings[m.id]?.qty||0)>0:m.kind===marketTab);return`<div class="metric-grid"><div class="metric"><span>Portfolio value</span><strong>${money(pv,true)}</strong><small>All investments</small></div><div class="metric"><span>Unrealized return</span><strong class="${pv-cost>=0?'positive':'negative'}">${money(pv-cost,true)}</strong><small>${cost?((pv-cost)/cost*100).toFixed(1):'0.0'}% on cost basis</small></div><div class="metric"><span>Available cash</span><strong>${money(s.cash,true)}</strong><small>Ready to invest</small></div></div><div class="section-title" style="margin-bottom:-10px"><div class="tab-row">${[['stock','Stocks'],['crypto','Crypto'],['holdings','My portfolio']].map(([id,label])=>`<button class="${marketTab===id?'selected':''}" data-market-tab="${id}">${label}</button>`).join('')}</div><span class="muted" style="font-size:9px">${I('clock')} Updates each year</span></div><div class="table-wrap"><table class="market-table"><thead><tr><th>Asset</th><th>Price</th><th>Year</th><th class="spark-col">Trend</th><th class="holding-col">Owned</th><th></th></tr></thead><tbody>${list.length?list.map(m=>`<tr><td><div class="market-name"><div class="coin-logo" style="--coin:${m.color}">${m.id==='BTC'?'₿':m.id==='ETH'?'Ξ':m.id.slice(0,2)}</div><div><strong>${m.name}</strong><small>${m.id} · ${m.kind==='crypto'?'Crypto':m.sector}</small></div></div></td><td class="mono">${money(m.price)}</td><td class="mono ${m.change>=0?'positive':'negative'}">${m.change>=0?'+':''}${m.change.toFixed(1)}%</td><td class="spark-col"><div class="spark">${chart(m.history,m.change>=0?'#9bb779':'#cb9990',false)}</div></td><td class="holding-col mono">${money((s.holdings[m.id]?.qty||0)*m.price,true)}</td><td><button class="btn small secondary" data-trade="${m.id}">Trade</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty"><h3>A blank portfolio is a beginning.</h3><p>Explore the market and make your first investment.</p></div></td></tr>'}</tbody></table><div class="table-foot">All prices and returns are fictional simulation data. Fractional shares supported. Markets can rise, crash, and surprise you.</div></div><div class="notice">${I('info')}<span>Buy with cash or sell investments you own. Prices change when you age up. Crypto mining revenue is linked to the simulated Bitcoin market.</span></div>`;}
function businessPage(){const s=state;return`<div class="metric-grid"><div class="metric"><span>Your businesses</span><strong>${s.businesses.length}</strong><small>Ideas brought to life</small></div><div class="metric"><span>Last annual profit</span><strong>${money(s.businesses.reduce((t,b)=>t+b.profit,0),true)}</strong><small>Before personal tax</small></div><div class="metric"><span>Combined valuation</span><strong>${money(s.businesses.reduce((t,b)=>t+b.value,0),true)}</strong><small>Your business equity</small></div></div>${s.businesses.length?`<section><div class="section-title"><h2>Your growing empire</h2><span class="muted">Founder & owner</span></div><div class="cards-2">${s.businesses.map(b=>{const d=E.INDUSTRIES.find(x=>x.id===b.industry);return`<article class="feature-card"><div class="business-visual">${I(d.icon)}</div><div class="card-top"><h3>${esc(b.name)}</h3><span class="badge">Level ${b.level}</span></div><p>${d.name} · ${b.staff} employees${b.rigs?' · '+b.rigs+' mining rigs':''}</p><div class="business-stats"><div><span>Revenue</span><strong>${money(b.revenue,true)}</strong></div><div><span>Net profit</span><strong class="${b.profit>=0?'positive':'negative'}">${money(b.profit,true)}</strong></div><div><span>Valuation</span><strong>${money(b.value,true)}</strong></div></div><button class="btn small secondary full" data-business="${b.id}">Manage business ${I('arrow')}</button></article>`;}).join('')}</div></section>`:empty('building','Your next big idea starts here.','Start small, invest in your product, and grow a company that is entirely your own.')}
 <section><div class="section-title"><h2>What will you build?</h2><span class="muted">Start your founder chapter</span></div><div class="cards-2">${E.INDUSTRIES.map(b=>`<article class="feature-card"><div class="card-top"><div class="quick-icon">${I(b.icon)}</div><span class="badge">${b.id==='mining'?'Market-linked':b.id==='ai'?'High growth':'Be your own boss'}</span></div><h3>${b.name}</h3><p>${b.desc}</p><div class="card-bottom"><div><div class="price">${money(b.cost,true)}</div><small class="muted" style="font-size:8px">Startup capital</small></div><button class="btn small secondary" data-start-business="${b.id}">Start ${I('plus')}</button></div></article>`).join('')}</div></section><div class="notice">${I('bolt')}<span>Revenue arrives when you age up. Product quality, reputation, employees, scale, and market demand affect your results. Payroll is $2,100 per employee per year; mining costs $4,200 per rig per year.</span></div>`;}
function assetsPage(){const s=state;return`<div class="metric-grid"><div class="metric"><span>Your assets</span><strong>${money(s.assets.reduce((t,a)=>t+a.value,0),true)}</strong><small>${s.assets.length} things to call yours</small></div><div class="metric"><span>Annual rental income</span><strong>${money(s.assets.reduce((t,a)=>t+(a.rented?a.rent:0),0),true)}</strong><small>Before upkeep & tax</small></div><div class="metric"><span>Outstanding debt</span><strong>${money(s.debt,true)}</strong><small>7% annual interest</small></div></div>${s.assets.length?`<section><div class="section-title"><h2>A life you are building</h2></div><div class="panel">${s.assets.map(a=>`<div class="list-row"><div class="quick-icon">${I(a.icon)}</div><div class="list-main"><h3>${esc(a.name)}</h3><p>${money(a.value)} market value · ${a.rented?'Rented out · '+money(a.rent)+'/yr':'Yours to enjoy'}</p></div><button class="btn small secondary" data-asset="${a.id}">Manage</button></div>`).join('')}</div></section>`:''}<section><div class="section-title"><h2>Make yourself at home</h2><span class="muted">Property, vehicles & a little luxury</span></div><div class="cards-2">${E.PROPERTIES.map(a=>`<article class="feature-card"><div class="quick-icon">${I(a.icon)}</div><h3>${a.name}</h3><p>${a.type} · ${money(a.upkeep)} yearly upkeep<br>${a.rent?money(a.rent)+' potential annual rent':'A little more freedom to explore'}</p><div class="card-bottom"><div class="price">${money(a.price,true)}</div><button class="btn small secondary" data-buy-asset="${a.id}">Buy ${I('plus')}</button></div></article>`).join('')}</div></section><div class="wide-card"><h3>A little financial breathing room.</h3><p>Borrow within your personal limit, or pay down existing debt. Loans accrue 7% interest yearly, and 8% of available cash goes toward repayment each year.</p><div class="inline-actions"><button class="btn secondary" data-action="bank">${I('wallet')} Visit the bank</button><button class="btn secondary" data-action="annual">View annual finances</button></div></div>`;}
function activitiesPage(){return X.activityHub()+`<div class="notice">${I('bolt')}<span>You have <strong>${state.world.settings.unlimited?'unlimited':state.ap} energy</strong> left this year. Each activity uses 1 energy and can be done twice a year. Age up to recharge and explore more.</span></div><div class="cards-2">${E.ACTIVITIES.map(a=>`<article class="feature-card"><div class="card-top"><div class="quick-icon">${I(a.icon)}</div><span class="badge">${a.cost?money(a.cost):'On the house'}</span></div><h3>${a.name}</h3><p>${a.desc}</p><div class="inline-actions">${['health','happiness','smarts','looks','fame','karma'].filter(k=>a[k]).map(k=>`<span class="badge ${a[k]<0?'warn':''}">${a[k]>0?'+':''}${a[k]} ${k}</span>`).join('')}${a.id==='freelance'?'<span class="badge">Earn extra cash</span>':''}</div><button class="btn small secondary" data-activity="${a.id}" ${(state.activityCounts[a.id]||0)>=2?'disabled':''}>${(state.activityCounts[a.id]||0)>=2?'Come back next year':'Make time for it'} ${I('arrow')}</button></article>`).join('')}</div>`;}
function legacyPage(){const s=state;const achievements=[['first-job','On the ladder','Land your first job'],['investor','Skin in the game','Make an investment'],['founder','Built from scratch','Start a business'],['millionaire','The million club','Reach $1M net worth'],['billionaire','A different league','Reach $1B net worth'],['family','Family first','Welcome a child'],['graduate','The graduate','Earn a degree'],['homeowner','A place of your own','Buy a property'],['century','A century of stories','Reach age 100'],['balanced','Living well','95% health, happiness & smarts'],['empire','Empire builder','Own three businesses'],['influencer','A familiar face','Reach 50 fame']];return`<div class="metric-grid"><div class="metric"><span>Chapters lived</span><strong>${s.age}</strong><small>Generation ${s.generation}</small></div><div class="metric"><span>Achievements</span><strong>${s.achievements.length} / 12</strong><small>Little things. Big milestones.</small></div><div class="metric"><span>Your legacy</span><strong>${money(E.netWorth(s),true)}</strong><small>Estate after debt</small></div></div><section><div class="section-title"><h2>Milestones that make a life</h2></div><div class="achievement-grid">${achievements.map(([id,name,desc])=>{const a=s.achievements.find(x=>x.id===id);return`<article class="achievement ${a?'earned':''}">${I(a?'trophy':'lock')}<h3>${name}</h3><p>${a?'Unlocked at age '+a.age:desc}</p></article>`;}).join('')}</div></section><div class="wide-card"><div class="card-top"><h3>The story continues.</h3>${I('tree')}</div><p>After your life ends, choose a living child to inherit your net estate and begin a new generation. Your estate is converted to cash so they can choose their own path.</p><button class="btn secondary" data-action="death" ${s.dead?'':'disabled'}>Continue as a child ${I('arrow')}</button></div>${X.legacyExtras()}${journal(40)}`;}

function modal(html,{large=false,locked=false,view=null}={}){modalView=view;document.getElementById('modal-root').innerHTML=`<div class="modal-shade" data-shade="${locked?'locked':'close'}"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${locked?'':`<button class="modal-close" data-action="close" aria-label="Close dialog">${I('close')}</button>`}${html}<p id="dialog-error" class="dialog-error" aria-live="polite"></p></section></div>`;document.body.style.overflow='hidden';if(!updatingModal)requestAnimationFrame(()=>document.querySelector('.modal input:not([type=radio]),.modal button')?.focus({preventScroll:true}));}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';modalView=null;}
function modalHeader(ic,eyebrow,title,desc=''){return`<div class="modal-icon">${I(ic)}</div><div class="eyebrow">${eyebrow}</div><h2 id="dialog-title">${title}</h2>${desc?`<p class="modal-desc">${desc}</p>`:''}`;}
function confirmDialog(title,desc,onConfirm,label='Confirm'){modal(`${modalHeader('info','A NEW DIRECTION',title,desc)}<div class="form-actions"><button class="btn secondary" data-action="close">Keep things as they are</button><button class="btn" id="confirm-dialog">${label}</button></div>`);document.getElementById('confirm-dialog').onclick=onConfirm;}
function characterForm(edit=false,first=false){
 const appearance=E.normalizeAppearance(state.appearance);
 const cityOptions=[...new Set([state.city,'Los Angeles, USA','Menifee, USA','New York, USA','London, UK','Tokyo, Japan','Sydney, Australia','Toronto, Canada'])];
 const appearanceLabels={skin:'Skin tone',hair:'Hair color',hairStyle:'Hairstyle',eyes:'Eye color',shirt:'Outfit color'};
 const select=(key,label)=>`<div class="field"><label for="character-${key}">${label}</label><select class="input" name="${key}" id="character-${key}">${E.APPEARANCE_OPTIONS[key].map(([value,name])=>`<option value="${value}" ${appearance[key]===value?'selected':''}>${name}</option>`).join('')}</select></div>`;
 modal(`<div class="eyebrow">${edit?'MAKE IT YOUR OWN':'YOUR VERY FIRST CHAPTER'}</div><h2 id="dialog-title">${edit?'Your character. Your style.':'Who will you become?'}</h2><p class="modal-desc">${edit?'Change your name and appearance while keeping your current life and progress.':'Create a little character, then grow a whole life. Your story begins at age 1.'}</p><form id="character-form"><div class="character-preview-card"><div id="character-portrait" class="creator-portrait">${ParallelPortrait(appearance)}</div><div><strong id="character-preview-name">${esc(state.name)}</strong><p>${edit?'Age '+state.age+' · Your current chapter':'Age 1 · A brand-new beginning'}</p><span class="badge">${edit?'Progress stays yours':'Saved automatically after you begin'}</span></div></div><div class="field"><label for="character-name">Character name</label><input class="input" id="character-name" name="name" value="${esc(state.name)}" maxlength="60" placeholder="Choose any name" autocomplete="off" required></div><div class="field-grid"><div class="field"><label for="character-city">Hometown</label><select class="input" id="character-city" name="city">${cityOptions.map(city=>`<option ${city===state.city?'selected':''}>${esc(city)}</option>`).join('')}</select></div><div class="field"><label for="character-pronouns">Pronouns</label><select class="input" id="character-pronouns" name="pronouns">${['He / him','She / her','They / them'].map(p=>`<option ${p===state.pronouns?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="creator-section-label">A LOOK THAT FEELS LIKE YOU</div><div class="field-grid appearance-fields">${Object.entries(appearanceLabels).map(([key,label])=>select(key,label)).join('')}</div><div class="looks-field"><div><label for="character-looks">Looks rating</label><output id="character-looks-value">${Math.round(state.stats.looks)}%</output></div><input id="character-looks" class="looks-slider" name="looks" type="range" min="0" max="100" value="${Math.round(state.stats.looks)}"><p>Choose the game stat independently of your colors and hairstyle.</p></div><div class="form-actions">${!first?'<button class="btn secondary" type="button" data-action="close">Cancel</button>':''}<button class="btn" type="submit">${edit?'Save character':'Begin my life · Age 1'} ${I('arrow')}</button></div>${!edit&&!first?'<p class="file-note">Your new character starts in an empty save slot. Existing saved lives stay available.</p>':'<p class="file-note">Your character and progress are saved in this browser.</p>'}</form>`,{locked:first,view:()=>characterForm(edit,first)});
 const form=document.getElementById('character-form');
 const read=()=>{const d=Object.fromEntries(new FormData(form));return{name:d.name.trim(),city:d.city,pronouns:d.pronouns,looks:Number(d.looks),appearance:E.normalizeAppearance(Object.fromEntries(Object.keys(E.APPEARANCE_OPTIONS).map(key=>[key,d[key]])))};};
 form.addEventListener('input',()=>{const options=read();document.getElementById('character-portrait').innerHTML=ParallelPortrait(options.appearance);document.getElementById('character-preview-name').textContent=options.name||'Your character';document.getElementById('character-looks-value').textContent=options.looks+'%';});
 form.addEventListener('change',()=>{document.getElementById('character-portrait').innerHTML=ParallelPortrait(read().appearance);});
 form.onsubmit=e=>{e.preventDefault();const options=read();if(!options.name){toast('Give your character a name first.',true);return;}if(edit){run(s=>E.configureCharacter(s,options),'Your character has been saved.');}else{const oldPage=page;page='overview';const previousSlot=activeSlot;if(pendingSlot)activeSlot=String(pendingSlot);if(!run(()=>E.create({...options,age:1}),'Your story begins at age 1.')){page=oldPage;activeSlot=previousSlot;}pendingSlot=null;}};
}
function showNew(first=false,slot=null){if(!first){save();const empty=getSlots().find(x=>!x.name);slot=slot||empty?.slot;if(!slot||getSlots().find(x=>x.slot===Number(slot))?.name){toast('All five slots are occupied. Export a backup before replacing a life through Import.',true);W.saves();return;}pendingSlot=slot;}characterForm(false,first);}
function showCharacterEditor(){characterForm(true,false);}

function showEvent(){const p=state.pending;if(!p)return;const a=state.lastAnnual;modal(`${modalHeader('sparkles','AGE '+state.age+' · '+(state.birthYear+state.age),esc(p.title),esc(p.body))}${a?`<div class="review-strip"><div>Yearly income<strong>${money(a.salary+a.business+a.rent+(a.bonus||0)+(a.dividends||0)+(a.household||0),true)}</strong></div><div>Living costs<strong>${money(a.expenses,true)}</strong></div><div>Cash available<strong>${money(state.cash,true)}</strong></div></div>`:''}<div>${p.options.map((o,i)=>`<button class="choice-card" data-choice="${i}" ${(o.cash||0)<0&&state.cash<Math.abs(o.cash)?'disabled':''}><span><strong>${esc(o.text)}</strong><small>${esc(o.hint)}</small></span>${I('arrow')}</button>`).join('')}</div><p class="file-note">A small choice can become a big part of your story.</p>`,{locked:true,view:showEvent});}
function showAdmin(){modal(`${modalHeader('sliders','YOUR UNIVERSE. YOUR RULES.','The sandbox panel.','Bend the rules, skip the grind, or see what happens. These controls affect your own saved life.')}<div class="check-row"><div><strong>Immortality</strong><p>${state.immortal?'You can age forever. Health no longer ends this life.':'Live a mortal life, with health and aging.'}</p></div><button class="toggle ${state.immortal?'on':''}" data-admin-toggle="immortal" role="switch" aria-checked="${state.immortal}" aria-label="Immortality"><i></i></button></div><form id="admin-money"><div class="field"><label for="cash-set">Set available cash</label><div style="display:flex;gap:8px"><input id="cash-set" class="input" type="number" min="0" max="1000000000000000" step="any" value="${Math.floor(state.cash)}" required><button type="submit" class="btn">Set cash</button></div></div></form><div class="inline-actions">${[1e5,1e6,1e9].map(n=>`<button class="pill-button" data-admin-cash="${n}">+ ${money(n,true)}</button>`).join('')}</div><form id="admin-age"><div class="field"><label for="age-set">Jump to an age (no year simulation)</label><div style="display:flex;gap:8px"><input id="age-set" class="input" type="number" min="0" max="9999" step="1" value="${state.age}" required><button type="submit" class="btn secondary">Set age</button></div></div></form><div class="admin-grid"><button class="admin-option" data-admin="stats">${I('sparkles')} Max all stats</button><button class="admin-option" data-admin="energy">${I('bolt')} Refill energy to 99</button><button class="admin-option" data-admin="debt">${I('wallet')} Clear all debt</button><button class="admin-option" data-admin="revive">${I('heart')} Revive & restore health</button></div>${X.adminExtras()}<p class="file-note">Turn immortality off any time to become mortal again.</p>`,{view:showAdmin});document.getElementById('admin-money').onsubmit=e=>{e.preventDefault();run(s=>E.admin(s,'cash',Number(document.getElementById('cash-set').value)),'Your cash balance has been updated.',{keepModal:true,skipDeath:true});};document.getElementById('admin-age').onsubmit=e=>{e.preventDefault();run(s=>E.admin(s,'age',Number(document.getElementById('age-set').value)),'A new chapter, on your terms.',{keepModal:true,skipDeath:true});};}
function showTrade(id,side='buy'){const m=state.markets.find(m=>m.id===id),h=state.holdings[id]||{qty:0,cost:0};if(!m)return;const value=h.qty*m.price;modal(`${modalHeader('chart',m.id+' · '+(m.kind==='stock'?'STOCK MARKET':'CRYPTO MARKET'),m.name,esc(m.sector)+' · '+money(m.price)+' per unit')}<div class="small-chart">${chart(m.history,m.change>=0?'#8da867':'#c5988e')}</div><div class="review-strip"><div>Yearly change<strong class="${m.change>=0?'positive':'negative'}">${m.change>=0?'+':''}${m.change.toFixed(2)}%</strong></div><div>Your position<strong>${money(value,true)}</strong></div><div>Cash available<strong>${money(state.cash,true)}</strong></div></div><div class="tab-row"><button class="${side==='buy'?'selected':''}" data-trade-side="buy" data-id="${id}">Buy</button><button class="${side==='sell'?'selected':''}" data-trade-side="sell" data-id="${id}">Sell</button></div><form id="trade-form"><div class="field"><label for="trade-amount">${side==='buy'?'Amount to invest':'Value to sell'} in dollars</label><input class="input" id="trade-amount" type="number" min="0.000001" step="any" placeholder="e.g. 1000" required></div><div class="inline-actions">${[.25,.5,1].map(v=>`<button type="button" class="pill-button" data-trade-pct="${v}" data-side="${side}" data-id="${id}">${v===1?'Max':v*100+'%'}</button>`).join('')}</div><button class="btn full" style="margin-top:22px" type="submit">${side==='buy'?'Buy':'Sell'} ${m.id} ${I('arrow')}</button></form><p class="file-note">${side==='buy'?'Own a little, or own a lot. Fractional units supported.':'You own '+h.qty.toLocaleString('en-US',{maximumFractionDigits:6})+' units.'} No trading fees.</p>`,{view:()=>showTrade(id,side)});document.getElementById('trade-form').onsubmit=e=>{e.preventDefault();run(s=>E.trade(s,id,side,Number(document.getElementById('trade-amount').value)),side==='buy'?'Your investment is in.':'Your sale is complete.');};}
function showStartBusiness(id){const d=E.INDUSTRIES.find(x=>x.id===id);modal(`${modalHeader(d.icon,'YOUR FOUNDER CHAPTER',d.name,d.desc)}<div class="review-strip"><div>Startup capital<strong>${money(d.cost)}</strong></div><div>Energy required<strong>2 energy</strong></div><div>Starting team<strong>${d.staff} employees</strong></div></div><form id="start-form"><div class="field"><label for="business-name">What will you call it?</label><input class="input" id="business-name" maxlength="45" placeholder="${id==='ai'?'Evergreen AI':id==='mining'?'Greenlight Mining':id==='studio'?'Parallel Studios':id==='ecom'?'Sunday Supply':'The Little Green Café'}" required></div><p class="editor-note">Results are simulated every year. Invest in quality and growth to improve your odds. Profits are not guaranteed.</p><button class="btn full" style="margin-top:22px" type="submit">Take the leap · ${money(d.cost)} ${I('arrow')}</button></form>`,{view:()=>showStartBusiness(id)});document.getElementById('start-form').onsubmit=e=>{e.preventDefault();run(s=>E.startBusiness(s,id,document.getElementById('business-name').value),'Your founder story has begun.');};}
function showBusiness(id){const b=state.businesses.find(x=>x.id===id);if(!b)return;const d=E.INDUSTRIES.find(x=>x.id===b.industry);modal(`${modalHeader(d.icon,d.name.toUpperCase()+' · YEAR '+b.years,esc(b.name),'Small improvements compound into something remarkable.')}<div class="business-stats"><div><span>Annual revenue</span><strong>${money(b.revenue)}</strong></div><div><span>Annual profit</span><strong>${money(b.profit)}</strong></div><div><span>Valuation</span><strong>${money(b.value)}</strong></div></div><div class="data-rows"><div class="data-row"><span>Scale & team</span><strong>Level ${b.level} · ${b.staff} employees${b.rigs?' · '+b.rigs+' rigs':''}</strong></div><div class="data-row"><span>Product quality / reputation</span><strong>${Math.round(b.quality)}% / ${Math.round(b.reputation)}%</strong></div></div><div class="admin-grid">${[['scale','building','Expand operations',d.cost*.55*b.level],['hire','people','Hire an employee',2500],['quality','sparkles','Improve product',3000*b.level],['marketing','chart','Run a campaign',2000*b.level],...(b.industry==='mining'?[['rig','cpu','Add a mining rig',5000]]:[])].map(([action,ic,label,cost])=>`<button class="admin-option" data-manage="${action}" data-id="${id}">${I(ic)}<span>${label}<small style="display:block;font-size:8px;color:#a2b08f">${money(cost)} · 1 energy</small></span></button>`).join('')}</div><div class="horizontal-rule"></div><button class="btn secondary full" data-sell-business="${id}">Sell business for ${money(b.value)} ${I('arrow')}</button><p class="file-note">Operating profits are paid into your cash balance when you age up.</p>`,{view:()=>showBusiness(id)});}
function showPerson(id){const p=state.people.find(x=>x.id===id);if(!p)return;const romantic=['Partner','Spouse'].includes(p.role);modal(`${modalHeader('people',esc(p.role).toUpperCase(),esc(p.name),p.age+' years old · '+Math.round(p.bond)+'% relationship')}<button class="choice-card" data-rel="spend" data-id="${id}"><span><strong>Make a little time.</strong><small>Spend time together · +12 bond · 1 energy</small></span>${I('heart')}</button><button class="choice-card" data-rel="gift" data-id="${id}"><span><strong>A thoughtful surprise.</strong><small>$200 gift · +20 bond · 1 energy</small></span>${I('bag')}</button>${p.role==='Partner'?`<button class="choice-card" data-rel="marry" data-id="${id}"><span><strong>Make it forever.</strong><small>Marriage · $3,000 · 75% bond required</small></span>${I('diamond')}</button>`:''}${romantic?`<button class="choice-card" data-rel="baby" data-id="${id}"><span><strong>Welcome a child.</strong><small>$1,200 · Base dependent costs: $4,600/year before regional and lifestyle adjustments</small></span>${I('tree')}</button><button class="choice-card" data-rel="breakup" data-id="${id}"><span><strong>Go separate ways.</strong><small>End this relationship</small></span>${I('arrow')}</button>`:''}`,{view:()=>showPerson(id)});}
function showEnroll(name){const p=E.PROGRAMS.find(x=>x.name===name);modal(`${modalHeader('book','INVEST IN YOURSELF',name,'A '+p.years+'-year commitment to your future. This is full-time study: finish or leave your current job before enrolling.')}<div class="review-strip"><div>Total tuition<strong>${money(p.cost)}</strong></div><div>Duration<strong>${p.years} years</strong></div><div>Required smarts<strong>${p.smart}%</strong></div></div><p class="editor-note">Tuition covers the entire program. You can pay from savings or finance it with a loan at 7% annual interest.</p><div class="form-actions"><button class="btn secondary" data-confirm-enroll="${name}" data-loan="true">Take a student loan</button><button class="btn" data-confirm-enroll="${name}" data-loan="false">Pay ${money(p.cost)} now</button></div>`,{view:()=>showEnroll(name)});}
function showAsset(id){const a=state.assets.find(x=>x.id===id);if(!a)return;modal(`${modalHeader(a.icon,a.type.toUpperCase(),a.name,'A little piece of the world to call your own.')}<div class="data-rows"><div class="data-row"><span>Current value</span><strong>${money(a.value)}</strong></div><div class="data-row"><span>Annual upkeep</span><strong>${money(a.upkeep)}</strong></div>${a.type==='Property'?`<div class="data-row"><span>Potential annual rental income</span><strong>${money(a.rent)}</strong></div>`:''}</div><div class="form-actions">${a.type==='Property'?`<button class="btn secondary" data-asset-action="rent" data-id="${id}">${a.rented?'Stop renting':'Rent out property'}</button>`:''}<button class="btn" data-asset-action="sell" data-id="${id}">Sell · ${money(a.value*.95)}</button></div><p class="file-note">Property values fluctuate yearly. Vehicles depreciate 10% per year. Selling has a 5% fee.</p>`,{view:()=>showAsset(id)});}
function showBank(){modal(`${modalHeader('wallet','A LITTLE BREATHING ROOM','Your personal bank.','Borrow to open a door, or pay down debt to give your future self more freedom.')}<div class="review-strip"><div>Available cash<strong>${money(state.cash,true)}</strong></div><div>Current debt<strong>${money(state.debt,true)}</strong></div><div>Annual interest<strong>7%</strong></div></div><form id="bank-form"><div class="field"><label for="bank-action">What would you like to do?</label><select class="input" id="bank-action"><option value="borrow">Take out a loan</option><option value="repay">Repay debt</option></select></div><div class="field"><label for="bank-amount">Amount in dollars</label><input class="input" id="bank-amount" type="number" min="1" max="1000000000000" required placeholder="e.g. 5000"></div><button type="submit" class="btn full">Make it happen ${I('arrow')}</button></form>`,{view:showBank});document.getElementById('bank-form').onsubmit=e=>{e.preventDefault();run(s=>E.bank(s,document.getElementById('bank-action').value,Number(document.getElementById('bank-amount').value)),'Your bank account has been updated.');};}
function showAnnual(){const a=state.lastAnnual;modal(`${modalHeader('chart','AGE '+state.age+' · FINANCES','A year in numbers.',a?'The choices you make add up. Here is where your money went this year.':'Age up to see your first yearly financial report.')}<div class="data-rows">${a?[['Salary & pension',a.salary],['Business profits',a.business],['Rental income',a.rent],['Income tax',-a.tax],['Living costs & upkeep',-a.expenses],['Loan repayments',-a.debtPayment],['Royalties, bonds & ongoing care',a.extra||0]].map(([label,value])=>`<div class="data-row"><span>${label}</span><strong class="${value<0?'negative':''}">${money(value)}</strong></div>`).join('')+`<div class="data-row total"><span>Annual cash flow</span><strong>${money(a.net)}</strong></div><div class="data-row"><span>Unrealized market movement</span><strong>${money(a.market)}</strong></div><div class="data-row"><span>Interest added to debt</span><strong>${money(a.interest)}</strong></div>`:''}<div class="data-row"><span>Current cash</span><strong>${money(state.cash)}</strong></div><div class="data-row"><span>Outstanding debt</span><strong>${money(state.debt)}</strong></div><div class="data-row total"><span>Total net worth</span><strong>${money(E.netWorth(state))}</strong></div></div><p class="file-note">Living costs: $1,800/year at 18–22; $7,200/year from 23, plus dependents and asset upkeep. Parent support covers childhood. Taxes: 18%, or 26% above $150K salary + business profit.</p>`,{view:showAnnual});}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='parallel-'+state.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-age-'+state.age+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your save file is ready.');}
function showSave(){modal(`${modalHeader('download','EVERY CHAPTER, KEPT SAFE.','Take your story with you.','Your progress saves automatically in this browser. Export a file to back up this life or move it to another device.')}<button class="choice-card" data-action="export"><span><strong>Export this life</strong><small>Download a JSON save with your full story.</small></span>${I('download')}</button><button class="choice-card" data-action="import"><span><strong>Import a saved life</strong><small>Choose a Parallel JSON save. Replaces this life after validation.</small></span>${I('upload')}</button><p class="file-note">${esc(state.name)} · Age ${state.age} · ${money(E.netWorth(state),true)} net worth</p>`,{view:showSave});}
function showDeath(){if(!state.dead)return;const children=state.people.filter(p=>p.alive&&p.role==='Child');modal(`${modalHeader('tree','A LIFE WITH A STORY',esc(state.name),state.age+' years lived. '+state.achievements.length+' milestones earned. A net estate of '+money(Math.max(0,E.netWorth(state)),true)+'.')}<p class="modal-desc">${children.length?'Every ending holds a new beginning. Choose a child to continue with their equal share after your charitable bequest. Household settings can disable inheritance.':'Your story will always be yours. Begin a fresh life, or use the sandbox panel to keep this one going.'}</p>${children.map(p=>`<button class="choice-card" data-heir="${p.id}"><span><strong>Continue as ${esc(p.name)}</strong><small>Age ${p.age} · Generation ${state.generation+1}</small></span>${I('arrow')}</button>`).join('')}<div class="form-actions"><button class="btn secondary" data-action="admin">Open sandbox</button><button class="btn" data-action="new">Start a new life</button></div>`,{view:showDeath});}
function showProfile(){modal(`${modalHeader('leaf','YOUR OWN LITTLE UNIVERSE',esc(state.name),esc(state.pronouns)+' · '+esc(state.city))}<div class="data-rows">${[['Age',state.age+' years'],['Education',state.education.level],['Degrees',state.education.degrees.join(', ')||'Your story is still unfolding'],['Fame',Math.round(state.stats.fame)+'%'],['Karma',Math.round(state.stats.karma)+'%'],['Generation',state.generation],['Mortality',state.immortal?'Immortal':'Mortal']].map(([k,v])=>`<div class="data-row"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="form-actions"><button class="btn secondary" data-action="edit-character">Edit character</button><button class="btn" data-action="close">Back to my story ${I('arrow')}</button></div>`,{view:showProfile});}

document.addEventListener('click',e=>{
 const b=e.target.closest('button,a[data-nav],[data-shade],[data-action="menu"]');if(!b||b.disabled)return;const d=b.dataset;
 if(d.shade){if(e.target===b&&d.shade==='close')closeModal();return;}
 if(W.handle(d,b))return;
 if(X.handle(d,b))return;
 if(d.nav){e.preventDefault();closeModal();nav(d.nav);return;}
 if(d.filter){journalTab=d.filter;render();return;}
 if(d.marketTab){marketTab=d.marketTab;render();return;}
 if(d.trade)return showTrade(d.trade);
 if(d.tradeSide)return showTrade(d.id,d.tradeSide);
 if(d.tradePct){const m=state.markets.find(x=>x.id===d.id);const max=d.side==='buy'?state.cash:(state.holdings[d.id]?.qty||0)*m.price;document.getElementById('trade-amount').value=Math.floor(max*Number(d.tradePct)*1e6)/1e6;return;}
 if(d.choice!==undefined)return run(s=>E.choose(s,Number(d.choice)),'Another moment in your story.');
 if(d.adminCash)return run(s=>E.admin(s,'cash',s.cash+Number(d.adminCash)),'A little extra possibility.',{keepModal:true,skipDeath:true});
 if(d.adminToggle)return run(s=>E.admin(s,d.adminToggle,d.adminToggle==='unlimited'?!s.world.settings.unlimited:!s.immortal),'Your sandbox rules have been updated.',{keepModal:true,skipDeath:true});
 if(d.admin)return run(s=>E.admin(s,d.admin),'The universe is listening.',{keepModal:true,skipDeath:true});
 if(d.activity)return run(s=>E.activity(s,d.activity),'A little time, well spent.');
 if(d.job)return run(s=>E.applyJob(s,d.job),'Welcome to your next chapter.');
 if(d.career)return run(s=>E.career(s,d.career),'Your career story keeps growing.');
 if(d.enroll)return showEnroll(d.enroll);
 if(d.confirmEnroll)return run(s=>E.enroll(s,d.confirmEnroll,d.loan==='true'),'Your first day is waiting.');
 if(d.startBusiness)return showStartBusiness(d.startBusiness);
 if(d.business)return showBusiness(d.business);
 if(d.manage)return run(s=>E.manageBusiness(s,d.id,d.manage),'A little investment in a bigger future.',{keepModal:true});
 if(d.sellBusiness)return confirmDialog('Ready for a new chapter?','Sell this business at its current valuation? Your proceeds will be added to cash.',()=>run(s=>E.manageBusiness(s,d.sellBusiness,'sell'),'Here is to a successful exit.'),'Sell business');
 if(d.person)return X.showPerson(d.person,()=>showPerson(d.person));
 if(d.rel==='breakup')return confirmDialog('Go your separate ways?','This will end your current relationship. You can meet someone new when you are ready.',()=>run(s=>E.relationship(s,d.id,'breakup'),'A new chapter begins.'),'End relationship');
 if(d.rel)return run(s=>E.relationship(s,d.id,d.rel),'A moment to remember.');
 if(d.buyAsset){const a=E.PROPERTIES.find(x=>x.id===d.buyAsset);return confirmDialog('Make it yours?','Buy '+a.name.toLowerCase()+' for '+money(a.price)+'? Annual upkeep is '+money(a.upkeep)+'.',()=>run(s=>E.buyAsset(s,a.id),'A little piece of the good life.'),'Buy '+money(a.price));}
 if(d.asset)return showAsset(d.asset);
 if(d.assetAction==='sell')return confirmDialog('Time to let it go?','Sell this asset for 95% of its current market value?',()=>run(s=>E.asset(s,d.id,'sell'),'Your sale is complete.'),'Sell asset');
 if(d.assetAction)return run(s=>E.asset(s,d.id,d.assetAction),'Your property plan has been updated.');
 if(d.heir)return run(s=>E.legacy(s,d.heir),'The next generation starts here.');
 switch(d.action){
 case'menu':sidebarOpen=!sidebarOpen;render();break;
 case'close':closeModal();break;
 case'age':if(state.dead)showDeath();else if(state.pending)showEvent();else if(run(s=>E.ageUp(s),'',{})){if(state.dead)showDeath();else showEvent();}break;
 case'new':showNew();break;
 case'edit-character':showCharacterEditor();break;
 case'admin':showAdmin();break;
 case'event':showEvent();break;
 case'profile':showProfile();break;
 case'phone':location.href=phonePreview?location.pathname:location.pathname+'?mobile=1';break;
 case'save-menu':showSave();break;
 case'export':exportSave();break;
 case'import':document.getElementById('import-file').click();break;
 case'annual':showAnnual();break;
 case'bank':showBank();break;
 case'meet':run(s=>E.meet(s,false),'A new connection, a new possibility.');break;
 case'date':run(s=>E.meet(s,true),'You never know where a first hello will lead.');break;
 case'adopt':confirmDialog('A little more love to give?','Adopt a child for $5,000. Base dependent costs increase by $4,600 per year, adjusted for region, inflation, and lifestyle, until age 18.',()=>run(s=>E.relationship(s,s.people.find(p=>p.alive)?.id,'adopt'),'Welcome to the family.'),'Adopt a child');break;
 case'quit':confirmDialog('Find a new direction?','Resign from your current role? You can apply for a different job right away.',()=>run(s=>E.career(s,'quit'),'A new beginning.'),'Resign');break;
 case'dropout':confirmDialog('A different path?','Leave your current program? Tuition is not refunded and student debt remains.',()=>run(s=>{E.activity(s,'meditate');s.education.program=null;s.education.remaining=0;E.log(s,'A different path.','Left university to explore something new.','education');return s;},'Your future is still yours.'),'Leave program');break;
 case'study':run(s=>E.activity(s,'read'),'Your future self will thank you.');break;
 case'death':showDeath();break;
 }
});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10e6)throw Error('That file is too large. Select a Parallel JSON save under 10 MB.');const data=E.validateSave(JSON.parse(await f.text()));confirmDialog('Return to this story?','Import '+esc(data.name)+' at age '+data.age+'? This replaces your current life.',()=>{if(run(()=>data,'Welcome back to your story.')){page='overview';render();if(state.pending)showEvent();}},'Load this life');}catch(err){toast(err.message,true);}e.target.value='';});
document.addEventListener('input',e=>{if(e.target.id==='career-search'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-job-card]').forEach(card=>{card.hidden=!card.textContent.toLowerCase().includes(q);});}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.pending&&!document.querySelector('[data-shade="locked"]'))closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const focusable=Array.from(document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select')).filter(el=>el.offsetParent!==null);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
render();if(needsCharacter)showNew(true);else{save();if(state.pending)showEvent();else if(state.dead)showDeath();}
})();

</script>
</body>
</html>
